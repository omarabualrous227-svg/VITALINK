      <a class="mapsLink" target="_blank" rel="noopener" href="${directionsUrl(h)}">${T("Open turn-by-turn navigation in Google Maps","فتح التوجيه الكامل في Google Maps")} ↗</a>
      ${S.case.status==="EN_ROUTE"?`<div class="enroute">${T("Transport in progress — receiving hospital is confirmed and has the pre-arrival brief.","النقل قيد التنفيذ — المستشفى المستقبل مؤكد ولديه ملخص ما قبل الوصول.")}</div>`:""}
      ${S.case.status==="ARRIVED"?`<div class="enroute">${T("Arrival recorded — hospital handoff confirmation is now required.","تم تسجيل الوصول — يلزم الآن تأكيد تسليم المريض للمستشفى.")}</div>`:""}
    </div>
  </div>`
}

function hospitalOperationalState(h){
  if(!h.accept||h.beds<=0)return {key:"closed",label:T("UNAVAILABLE","غير متاح")};
  if(h.cap<45||h.beds<=2)return {key:"limited",label:T("LIMITED","محدود")};
  return {key:"ready",label:T("READY","جاهز")}
}
function prepPercent(){
  const p=S.case.prearrival||{team:false,bay:false,monitor:false};
  return Math.round([p.team,p.bay,p.monitor].filter(Boolean).length/3*100)
}
function hospitalTarget(){
  return S.hospitals.find(h=>h.id===(S.case.readinessRequest||S.case.selected))
}
function receivingRequirement(){
  const n=caseNeeds();
  return n.specialty==="cardiac"?T("Cardiac-capable emergency care","طوارئ بقدرة قلبية"):n.specialty==="trauma"?T("Trauma-capable emergency care","طوارئ قادرة على الإصابات"):T("General emergency receiving","استقبال طوارئ عام")
}

function hospitalScreen(){
  const target=hospitalTarget();
  const activeReq=!!S.case.readinessRequest;
  const confirmed=S.case.hospitalConfirmed;
  const totalBeds=S.hospitals.reduce((a,h)=>a+h.beds,0);
  const accepting=S.hospitals.filter(h=>h.accept&&h.beds>0).length;
  const avgCap=Math.round(S.hospitals.reduce((a,h)=>a+h.cap,0)/S.hospitals.length);
  const lastRefresh=Math.max(...S.hospitals.map(h=>h.lastUpdated||0));

  return `<div class="pageHead"><div><h2>${T("Receiving Hospital Command Center","مركز قيادة المستشفى المستقبل")}</h2><p>${T("Maintain readiness data, receive the EMS handoff request, make an explicit accept/decline decision and prepare the receiving team before arrival.","حدّث بيانات الجاهزية، استقبل طلب الإسعاف، اتخذ قرار قبول أو رفض واضح، وجهّز فريق الاستقبال قبل الوصول.")}</p></div>${badge(T("SYNTHETIC MVP READINESS","جاهزية MVP تجريبية"),"bBlue")}</div>

  ${workflow()}

  <div class="hospitalTopGrid">
    <div class="hospitalCommandHero">
      <div class="hospitalCommandTop">
        <div><div class="label">${T("NETWORK READINESS OVERVIEW","نظرة عامة على جاهزية الشبكة")}</div><div class="commandTitle">${T("Hospital Receiving Operations","عمليات استقبال الحالات")}</div><div class="commandSub">${T("The values below are synthetic MVP inputs used to demonstrate how hospital readiness changes the EMS destination decision.","القيم أدناه مدخلات تجريبية للـMVP توضح كيف تغيّر جاهزية المستشفى قرار وجهة الإسعاف.")}</div></div>
        <span class="${S.case.routeAlert?"requestSignal warn":activeReq?confirmed?"requestSignal ready":"requestSignal":"feedLive"}">${S.case.routeAlert?T("READINESS CHANGED","تغيرت الجاهزية"):activeReq?confirmed?T("REQUEST CONFIRMED","تم تأكيد الطلب"):T("EMS REQUEST ACTIVE","طلب إسعاف نشط"):T("NO ACTIVE REQUEST","لا يوجد طلب نشط")}</span>
      </div>
      <div class="hospitalOverall">
        <div class="overallMetric"><span>${T("AVAILABLE BEDS","الأسرة المتاحة")}</span><b>${totalBeds}</b></div>
        <div class="overallMetric"><span>${T("HOSPITALS ACCEPTING","مستشفيات تستقبل")}</span><b>${accepting}/${S.hospitals.length}</b></div>
        <div class="overallMetric"><span>${T("AVG ED CAPACITY","متوسط سعة الطوارئ")}</span><b>${avgCap}%</b></div>
      </div>
    </div>

    <div class="hospitalFeed">
      <div class="hospitalFeedHead"><div><h3>${T("Readiness Feed","بيانات الجاهزية")}</h3><div class="small">${T("Last synthetic update","آخر تحديث تجريبي")}: ${freshAgo(lastRefresh)}</div></div><span class="feedLive">${T("FEED ACTIVE","البيانات نشطة")}</span></div>
      <div class="feedLine"><div><b>${T("Incoming EMS requests","طلبات الإسعاف الواردة")}</b><span>${T("Current demo queue","قائمة العرض الحالية")}</span></div><strong>${activeReq?1:0}</strong></div>
      <div class="feedLine"><div><b>${T("Current receiving hospital","المستشفى المستقبل الحالي")}</b><span>${T("Based on EMS match / request","بناءً على مطابقة وطلب الإسعاف")}</span></div><strong>${target?(S.lang==="ar"?target.ar:target.en):"—"}</strong></div>
      <div class="feedLine"><div><b>${T("Required capability","القدرة المطلوبة")}</b><span>${T("Derived from the current emergency case","مستنتجة من الحالة الطارئة الحالية")}</span></div><strong>${receivingRequirement()}</strong></div>
      <button class="btn ghost" style="margin-top:10px" onclick="V.refreshHospitalData()">${T("Refresh Readiness Feed","تحديث بيانات الجاهزية")}</button>
    </div>
  </div>

  <h3 style="margin:21px 0 9px">${T("Hospital Operational Readiness","الجاهزية التشغيلية للمستشفيات")}</h3>
  <div class="small" style="margin-bottom:11px">${T("These controls directly affect the paramedic ranking and recommendation.","هذه القيم تؤثر مباشرة على ترتيب المستشفيات وتوصية المسعف.")}</div>
  <div class="hospitalCards">${S.hospitals.map(h=>hospitalAdmin(h)).join("")}</div>

  <div style="margin-top:17px">${incomingRequest()}</div>

  ${confirmed&&target?handoffBriefPanel(target,"hospital"):""}
  ${confirmed?preArrivalPanel(target):""}
  ${confirmed?lifecyclePanel():""}

  <div class="auditGrid">
    <div class="card"><h3>${T("System Audit Timeline","سجل أحداث النظام")}</h3>${timeline()}</div>
    <div class="card"><h3>${T("MVP Integration Boundary","حدود تكامل الـMVP")}</h3><div class="commandNote">${T("Hospital capacity, bed availability and acceptance status are synthetic in this prototype. A real deployment would require an authorized hospital readiness feed or controlled manual operational input. The accept/decline decision remains human-confirmed.","سعة المستشفى وتوفر الأسرة وحالة الاستقبال بيانات تجريبية في هذا النموذج. التطبيق الفعلي يحتاج مصدر جاهزية مصرحًا به أو إدخالًا تشغيليًا يدويًا مضبوطًا. قرار القبول أو الرفض يبقى مؤكدًا من الإنسان.")}</div></div>
  </div>`;
}

function hospitalAdmin(h){
  const fresh=readinessFreshness(h),confidence=hospitalDataConfidence(h);
  const targeted=(S.case.readinessRequest===h.id)||(S.case.selected===h.id&&["HOSPITAL_MATCHED","READINESS_REQUESTED","HOSPITAL_READY","EN_ROUTE","ARRIVED","HANDOFF_COMPLETE","CASE_CLOSED"].includes(S.case.status));
  const st=hospitalOperationalState(h),pct=Math.round(h.beds/h.total*100),pc=pct>45?"pg":pct>20?"po":"pr";
  return `<div class="hospitalOpsCard ${targeted?"target":""}">
    ${targeted?`<div class="targetStrip">${S.case.readinessRequest===h.id?T("EMS READINESS REQUEST TARGET","هدف طلب جاهزية الإسعاف"):T("CURRENT EMS RECOMMENDATION","توصية الإسعاف الحالية")}</div>`:""}
    <div class="hospitalOpsHead"><div><h3>${S.lang==="ar"?h.ar:h.en}<span class="demoDataTag">${T("DEMO OPERATIONAL DATA","بيانات تشغيلية تجريبية")}</span></h3><div class="small">${freshAgo(h.lastUpdated)}</div><div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:6px"><span class="freshnessPill ${fresh.key}">${fresh.label}</span><span class="confidencePill ${confidence.key}">${T("Readiness confidence","ثقة الجاهزية")}: ${confidence.label}</span></div></div><span class="opsState ${st.key}">${st.label}</span></div>${fresh.key==="stale"?`<div class="staleWarning">${T("Readiness is older than 10 minutes. Refresh before confirming an EMS receiving request.","بيانات الجاهزية أقدم من 10 دقائق. حدّثها قبل تأكيد طلب استقبال الإسعاف.")}</div>`:""}

    <div class="opsMetrics">
      <div class="opsMetric"><b>${h.beds}</b><span>${T("Beds Available","أسرة متاحة")}</span></div>
      <div class="opsMetric"><b>${h.cap}%</b><span>${T("ED Capacity","سعة الطوارئ")}</span></div>
      <div class="opsMetric"><b>${h.cases}</b><span>${T("Current Cases","حالات حالية")}</span></div>
    </div>

    <div class="capacityBarLabel"><span>${T("Available-bed ratio","نسبة الأسرة المتاحة")}</span><span>${h.beds}/${h.total}</span></div>
    <div class="progress"><span class="${pc}" style="width:${pct}%"></span></div>

    <div class="opsControls">
      <div class="opsControl"><label>${T("Available Beds","الأسرة المتاحة")}</label><input aria-label="${T("Available Beds","الأسرة المتاحة")}" type="number" min="0" max="${h.total}" value="${h.beds}" onchange="V.updateHospital('${h.id}','beds',this.value)"></div>
      <div class="opsControl"><label>${T("ED Capacity %","سعة الطوارئ %")}</label><input aria-label="${T("ED Capacity %","سعة الطوارئ %")}" type="number" min="0" max="100" value="${h.cap}" onchange="V.updateHospital('${h.id}','cap',this.value)"></div>
      <div class="opsControl"><label>${T("Current Cases","الحالات الحالية")}</label><input aria-label="${T("Current Cases","الحالات الحالية")}" type="number" min="0" value="${h.cases}" onchange="V.updateHospital('${h.id}','cases',this.value)"></div>
      <div class="opsControl"><label>${T("Accept New Emergencies","استقبال حالات جديدة")}</label><select aria-label="${T("Accept New Emergencies","استقبال حالات جديدة")}" onchange="V.updateHospital('${h.id}','accept',this.value)"><option value="true" ${h.accept?"selected":""}>${T("Yes","نعم")}</option><option value="false" ${!h.accept?"selected":""}>${T("No","لا")}</option></select></div>
    </div>
  </div>`;
}

function incomingRequest(){
  const id=S.case.readinessRequest,h=S.hospitals.find(x=>x.id===id);
  if(!id||!h){
    const selected=S.hospitals.find(x=>x.id===S.case.selected);
    return `<div class="card"><h3>${T("Incoming EMS Readiness Request","طلب جاهزية وارد من الإسعاف")}</h3><div class="notice info">${selected?T(`EMS currently recommends ${selected.en}, but no readiness request has been sent yet.`,`يوصي الإسعاف حاليًا بـ ${selected.ar}، لكن لم يتم إرسال طلب جاهزية بعد.`):T("No active EMS readiness request. A request will appear here after the paramedic selects a hospital and asks for readiness confirmation.","لا يوجد طلب جاهزية نشط. سيظهر الطلب هنا بعد اختيار المسعف للمستشفى وطلب تأكيد الجاهزية.")}</div></div>`;
  }

  const needs=caseNeeds();
  const operational=hospitalOperationalState(h);
  const canConfirm=h.accept&&h.beds>0;
  const degraded=!!S.case.routeAlert&&S.case.routeAlert.hospitalId===h.id;

  return `<div class="incomingCommand">
    <div class="incomingTop">
      <div><div class="label">${T("INCOMING EMS HANDOFF","تسليم وارد من الإسعاف")}</div><h3>${S.case.id} • ${S.lang==="ar"?h.ar:h.en}</h3><div class="small">${T("Requested receiving readiness • ETA","طلب جاهزية الاستقبال • وقت الوصول")} ${h.eta} min</div></div>
      <span class="requestSignal ${degraded?"warn":S.case.hospitalConfirmed?"ready":""}">${degraded?T("READINESS CHANGED","تغيرت الجاهزية"):S.case.hospitalConfirmed?T("READINESS CONFIRMED","تم تأكيد الجاهزية"):T("ACTION REQUIRED","إجراء مطلوب")}</span>
    </div>

    <div class="handoffGrid">
      <div class="handoffPanel">
        <h4>${T("Patient Handoff Summary","ملخص تسليم المريض")}</h4>
        <div class="kv"><span>${T("Patient","المريض")}</span><span>${S.case.name||T("Unknown","غير معروف")}</span></div>
        <div class="kv"><span>${T("Emergency","الحالة")}</span><span>${emergencyLabel(S.case.emergency)}</span></div>
        <div class="kv"><span>${T("Required Capability","القدرة المطلوبة")}</span><span>${receivingRequirement()}</span></div>
        <div class="kv"><span>${T("Field Acuity Flag","مؤشر الحدة الميداني")}</span><span class="${needs.highAcuity?"orangeText":"ok"}">${needs.highAcuity?T("Higher-acuity demo flag","مؤشر تجريبي لحدة أعلى"):T("Standard demo flag","مؤشر تجريبي اعتيادي")}</span></div>
        <div class="kv"><span>${T("EMS Unit","وحدة الإسعاف")}</span><span>${S.case.ambulance}</span></div>
      </div>

      <div class="handoffPanel">
        <h4>${T("Field Vitals","العلامات الحيوية الميدانية")}</h4>
        <div class="handoffVitals">
          <div class="handoffVital"><b>${S.case.vitals.bp||"—"}</b><span>BP</span></div>
          <div class="handoffVital"><b>${S.case.vitals.hr||"—"}</b><span>HR</span></div>
          <div class="handoffVital"><b>${S.case.vitals.spo2?S.case.vitals.spo2+"%":"—"}</b><span>SpO₂</span></div>
          <div class="handoffVital"><b>${S.case.vitals.rr||"—"}</b><span>RR</span></div>
          <div class="handoffVital"><b>${S.case.vitals.temp?S.case.vitals.temp+"°":"—"}</b><span>Temp</span></div>
          <div class="handoffVital"><b>${T(S.case.vitals.con,S.case.vitals.con)}</b><span>${T("Consciousness","الوعي")}</span></div>
        </div>
        <div class="kv" style="margin-top:8px"><span>${T("Hospital Operational State","الحالة التشغيلية")}</span><span class="${operational.key==="ready"?"ok":operational.key==="limited"?"orangeText":"bad"}">${operational.label}</span></div>
        <div class="kv"><span>${T("Available Beds","الأسرة المتاحة")}</span><span>${h.beds}</span></div>
        <div class="kv"><span>${T("ED Capacity","سعة الطوارئ")}</span><span>${h.cap}%</span></div>
      </div>
    </div>

    <div class="decisionZone">
      <div class="decisionZoneHead"><div><h4>${T("Receiving Decision","قرار الاستقبال")}</h4><span>${T("Human-confirmed decision • immediately synced to EMS","قرار مؤكد بشريًا • ينعكس مباشرة على الإسعاف")}</span></div><span class="opsState ${operational.key}">${operational.label}</span></div>

      ${degraded
        ? `<div class="notice dangerN">${T("This hospital was confirmed earlier, but its operational readiness changed after transport started. EMS must review the destination manually; VITALINK will not reroute automatically.","تم تأكيد هذا المستشفى سابقًا، لكن جاهزيته التشغيلية تغيرت بعد بدء النقل. يجب على الإسعاف مراجعة الوجهة يدويًا ولن يقوم VITALINK بإعادة التوجيه تلقائيًا.")}</div>`
        : S.case.hospitalConfirmed
        ? `<div class="notice successN">${T("Bed and receiving readiness are confirmed. EMS navigation is unlocked and the pre-arrival preparation phase can begin.","تم تأكيد السرير وجاهزية الاستقبال. أصبح التوجيه متاحًا للمسعف ويمكن بدء التحضير قبل الوصول.")}</div>`
        : `<div class="decisionActions">
            <button class="btn successBtn" ${canConfirm?"":"disabled"} onclick="V.confirmHospital('${h.id}')">${T("Confirm Bed & Readiness","تأكيد السرير والجاهزية")}</button>
            <button class="btn danger" onclick="document.getElementById('declineBox').scrollIntoView({behavior:'smooth'})">${T("Unable to Receive","غير قادر على الاستقبال")}</button>
          </div>
          ${!canConfirm?`<div class="notice dangerN">${T("Confirmation is disabled because the hospital is not accepting cases or has no available beds.","تم تعطيل التأكيد لأن المستشفى لا يستقبل الحالات أو لا توجد أسرة متاحة.")}</div>`:""}
          <div class="declineBox" id="declineBox">
            <div class="label">${T("DECLINE REASON","سبب الرفض")}</div>
            <div class="declineReasons">
              ${[["no_beds",T("No Beds","لا توجد أسرة")],["overload",T("ED Overload","ضغط الطوارئ")],["capability",T("Capability Unavailable","القدرة غير متوفرة")],["other",T("Other","أخرى")]].map(([v,x])=>`<button class="declineReason ${S.declineReason===v?"active":""}" onclick="V.setDeclineReason('${v}')">${x}</button>`).join("")}
            </div>
            <button class="btn danger" style="margin-top:9px" onclick="V.declineHospital('${h.id}')">${T("Decline & Recalculate EMS Destination","رفض وإعادة حساب وجهة الإسعاف")}</button>
          </div>`
      }
    </div>
  </div>`;
}

function preArrivalPanel(h){
  if(!h)return "";
  const p=S.case.prearrival||{team:false,bay:false,monitor:false},pct=prepPercent();
  const arrived=["ARRIVED","HANDOFF_COMPLETE","CASE_CLOSED"].includes(S.case.status);
  return `<div class="prearrivalGrid">
    <div class="prepPanel">
      <div class="prepHead"><div><h3>${T("Pre-Arrival Preparation","التحضير قبل الوصول")}</h3><div class="small">${T("Operational readiness tasks after accepting the case","مهام الجاهزية التشغيلية بعد قبول الحالة")}</div></div><div class="prepProgress">${pct}%</div></div>
      <div class="progress" style="margin-top:10px"><span class="pg" style="width:${pct}%"></span></div>
      <div class="prepList">
        <button class="prepItem ${p.team?"done":""}" onclick="V.togglePrep('team')" style="width:100%;text-align:start"><span class="prepCheck">✓</span><span class="prepText"><b>${T("Receiving Team Alerted","تم تنبيه فريق الاستقبال")}</b><span>${T("Emergency staff notified of the incoming case","تم إبلاغ فريق الطوارئ بالحالة القادمة")}</span></span></button>
        <button class="prepItem ${p.bay?"done":""}" onclick="V.togglePrep('bay')" style="width:100%;text-align:start"><span class="prepCheck">✓</span><span class="prepText"><b>${T("Receiving Bay Prepared","تم تجهيز منطقة الاستقبال")}</b><span>${T("A receiving location is reserved for the incoming patient","تم حجز موقع استقبال للحالة القادمة")}</span></span></button>
        <button class="prepItem ${p.monitor?"done":""}" onclick="V.togglePrep('monitor')" style="width:100%;text-align:start"><span class="prepCheck">✓</span><span class="prepText"><b>${T("Core Monitoring Equipment Ready","معدات المراقبة الأساسية جاهزة")}</b><span>${T("Basic receiving equipment marked ready in the demo workflow","تم تحديد معدات الاستقبال الأساسية كجاهزة ضمن مسار العرض")}</span></span></button>
      </div>
    </div>

    <div class="arrivalCard">
      <div class="label">${arrived?T("PATIENT ARRIVAL","وصول المريض"):T("INCOMING AMBULANCE","سيارة الإسعاف القادمة")}</div>
      <div class="arrivalEta">${arrived?"✓":String(h.eta).padStart(2,"0")} ${!arrived?`<span style="font-size:12px">${T("min","دقائق")}</span>`:""}</div>
      <div class="small" style="color:#91A9B7">${S.case.ambulance} • ${S.case.id}</div>
      <div class="kv" style="margin-top:11px"><span>${T("Receiving Hospital","المستشفى المستقبل")}</span><span>${S.lang==="ar"?h.ar:h.en}</span></div>
      <div class="kv"><span>${T("Emergency","الحالة")}</span><span>${emergencyLabel(S.case.emergency)}</span></div>
      <div class="kv"><span>${T("Preparation","التحضير")}</span><span>${pct}%</span></div>
      <div class="arrivalState">${S.case.routeAlert?T("Readiness changed — manual coordination required","تغيرت الجاهزية — يلزم تنسيق يدوي"):S.case.status==="HOSPITAL_READY"?T("Hospital ready — waiting for EMS transport to start","المستشفى جاهز — بانتظار بدء نقل الإسعاف"):S.case.status==="EN_ROUTE"?T("Ambulance en route — receiving team preparation in progress","سيارة الإسعاف بالطريق — تحضير فريق الاستقبال مستمر"):S.case.status==="ARRIVED"?T("Patient arrived — confirm handoff below","وصل المريض — أكد التسليم أدناه"):S.case.status==="HANDOFF_COMPLETE"?T("Patient handoff completed ✓","اكتمل تسليم المريض ✓"):T("Case closed ✓","تم إغلاق الحالة ✓")}</div>
    </div>
  </div>

  ${["ARRIVED","HANDOFF_COMPLETE","CASE_CLOSED"].includes(S.case.status)?`
  <div class="lifecyclePanel">
    <div class="lifecycleHead"><div><h3>${T("Hospital Handoff","تسليم المريض للمستشفى")}</h3><p>${T("Explicit receiving confirmation closes the operational loop between EMS and hospital.","تأكيد الاستلام الصريح يغلق الحلقة التشغيلية بين الإسعاف والمستشفى.")}</p></div>${S.case.status==="CASE_CLOSED"?badge(T("CLOSED","مغلقة"),"bGreen"):""}</div>

    ${S.case.status==="ARRIVED"?`
      <div class="arrivalActionZone"><h4>${T("Patient has arrived","وصل المريض")}</h4><p>${T("Add an optional receiving note, then confirm that responsibility has been handed over to the hospital team.","أضف ملاحظة استقبال اختيارية ثم أكد انتقال مسؤولية الحالة إلى فريق المستشفى.")}</p>
        <div class="handoffNoteBox"><label>${T("Receiving Handoff Note","ملاحظة تسليم الاستقبال")}</label><textarea aria-label="${T("Receiving Handoff Note","ملاحظة تسليم الاستقبال")}" oninput="V.setHandoffNote(this.value)" placeholder="${T("Example: received in ED bay / team notified...","مثال: تم الاستلام في منطقة الطوارئ / تم إبلاغ الفريق...")}">${S.case.handoffNote||""}</textarea></div>
        <div class="arrivalActionRow"><button class="btn successBtn" onclick="V.confirmHandoff()">${T("Confirm Patient Handoff","تأكيد تسليم المريض")}</button></div>
      </div>`:""}

    ${S.case.status==="HANDOFF_COMPLETE"?`
      <div class="arrivalActionZone"><h4>${T("Handoff complete","اكتمل التسليم")}</h4><p>${T("The hospital has confirmed receipt of the patient. Close the emergency workflow when the operational handoff is complete.","أكد المستشفى استلام المريض. أغلق مسار الطوارئ بعد اكتمال التسليم التشغيلي.")}</p>
        ${S.case.handoffNote?`<div class="notice info">${S.case.handoffNote}</div>`:""}
        <div class="arrivalActionRow"><button class="btn primary" onclick="V.closeCase()">${T("Close Emergency Case","إغلاق حالة الطوارئ")}</button></div>
      </div>`:""}

    ${S.case.status==="CASE_CLOSED"?`
      <div class="closedCaseBanner"><b>${T("Case successfully closed","تم إغلاق الحالة بنجاح")}</b><span>${T("Patient handoff is documented and the full workflow remains visible in Case Audit.","تم توثيق تسليم المريض ويبقى كامل مسار العمل ظاهرًا في سجل الحالة.")}</span></div>`:""}
  </div>`:""}`;
}
/* SHELL */
function screen(){return S.screen==="patient"?patientScreen():S.screen==="dispatch"?dispatchScreen():S.screen==="ems"?emsScreen():hospitalScreen()}
function shell(){return `<div class="shell v26Readable ${presentationMode?"presentation":""}"><aside class="sidebar"><div class="brand"><div class="logo"></div><div><b>VITA<span>LINK</span> 2076</b><small>${T("Smart Emergency Coordination","تنسيق الطوارئ الذكي")}</small></div></div><div class="role"><label>${T("Interface","الواجهة")}</label><select aria-label="${T("Select interface","اختر الواجهة")}" onchange="V.go(this.value)"><option value="patient" ${S.screen==="patient"?"selected":""}>${T("Patient","المريض")}</option><option value="dispatch" ${S.screen==="dispatch"?"selected":""}>911</option><option value="ems" ${S.screen==="ems"?"selected":""}>${T("Paramedic","المسعف")}</option><option value="hospital" ${S.screen==="hospital"?"selected":""}>${T("Hospital","المستشفى")}</option></select></div><div class="navTitle">${T("System Interfaces","واجهات النظام")}</div><div class="nav">${nav("patient","01",T("Patient Request","طلب المريض"))}${nav("dispatch","02",T("911 Dispatch","مركز 911"))}${nav("ems","03",T("Paramedic & Route","المسعف والمسار"))}${nav("hospital","04",T("Hospital Readiness","جاهزية المستشفى"))}</div><div class="sidefoot">${T("Irbid MVP • Google Maps geographic context","MVP إربد • سياق جغرافي عبر Google Maps")}<br>${T("Hospital capacity values are synthetic demo data.","قيم سعة المستشفيات بيانات تجريبية للعرض.")}</div></aside><main class="main"><header class="topbar"><div><h1>${pageTitle()}</h1><div class="sub">${T("VITALINK MVP • Connected emergency workflow","VITALINK MVP • مسار طوارئ مترابط")}</div></div><div class="topActions">
  <div class="demoTools"><button class="presentationToggle" onclick="V.togglePresentation()">${presentationMode?T("Exit Presentation","إنهاء العرض"):T("Presentation Mode","وضع العرض")}</button><button class="scenarioBtn" onclick="V.openScenarioLab(true)">${T("Scenario Lab","مختبر السيناريوهات")}</button><button class="auditButton" onclick="V.setAuditOpen(true)">${T("Case Audit","سجل الحالة")}</button><button class="demoToolBtn" onclick="V.resetDemo()">${T("Reset","إعادة ضبط")}</button></div>
  <div class="lang"><button class="${S.lang==="en"?"active":""}" onclick="V.setLang('en')">EN</button><button class="${S.lang==="ar"?"active":""}" onclick="V.setLang('ar')">AR</button></div>
  <span class="syncHealth ${syncInfo().server?"":syncInfo().ok?"warn":"warn"}">${syncInfo().label}</span>${presentationMode?`<span class="presentationBadge">${T("PRESENTATION","عرض")}</span>`:""}<span class="simulationPill">${T("MVP Simulation","محاكاة MVP")}</span>
</div></header><div class="content">${presentationMode?"":backendNotice()}<div class="mobileUtilityBar"><button class="presentationToggle" onclick="V.togglePresentation()">${presentationMode?T("Exit Presentation","إنهاء العرض"):T("Presentation","العرض")}</button><button class="scenarioBtn" onclick="V.openScenarioLab(true)">${T("Scenario Lab","مختبر السيناريوهات")}</button><button class="auditButton" onclick="V.setAuditOpen(true)">${T("Case Audit","سجل الحالة")}</button><button class="demoToolBtn" onclick="V.resetDemo()">${T("Reset","إعادة ضبط")}</button></div>${liveSyncBanner()}${systemHealthStrip()}${globalResilienceAlert()}${caseRibbon()}${scenarioBanner()}${screen()}</div></main></div>`}

function overlay(){
  let o="";
  if(S.analysisStage){
    const st=S.analysisStage;
    o+=`<div class="analysisOverlay" role="status" aria-live="polite"><div class="analysisBox"><h3>${T("Finding the Appropriate Hospital","جارٍ البحث عن المستشفى المناسب")}</h3><p>${T("VITALINK is applying the MVP matching rules to the current case and synthetic hospital readiness.","يطبق VITALINK قواعد المطابقة التجريبية على الحالة الحالية وبيانات جاهزية المستشفيات التجريبية.")}</p><div class="analysisSteps"><div class="astep ${st===1?"active":st>1?"done":""}"><i class="adot"></i>${T("Checking hospital readiness","فحص جاهزية المستشفيات")}</div><div class="astep ${st===2?"active":st>2?"done":""}"><i class="adot"></i>${T("Comparing capacity and suitability","مقارنة السعة والملاءمة")}</div><div class="astep ${st===3?"active":""}"><i class="adot"></i>${T("Preparing recommendation and travel context","تجهيز التوصية وسياق الوصول")}</div></div></div></div>`;
  }
  if(S.toast)o+=`<div class="toast" role="status" aria-live="polite"><b>${S.lang==="ar"?S.toast.titleAr:S.toast.titleEn}</b><span>${S.lang==="ar"?S.toast.msgAr:S.toast.msgEn}</span></div>`;
  o+=overrideModal();
  o+=auditDrawer();
  o+=scenarioLabModal();
  return o;
}
function render(){
  document.documentElement.lang=S.lang;
  document.documentElement.dir=S.lang==="ar"?"rtl":"ltr";
  document.getElementById("app").innerHTML=shell();
  document.getElementById("overlay").innerHTML=overlay();
  if(document.querySelector(".mapFrame")){mapEmbedState="loading";setTimeout(mapFrameTimeout,5500)}else{mapEmbedState="idle"}
}
window.V={go,setLang,upd,vital,chooseEmergency,setRequestFor,useIrbid,geolocate,voice,submitPatient,assignAmbulance,acknowledgeAmbulance,runAnalysis,selectHospital,beginOverride,setOverrideReason,setOverrideNote,cancelOverride,confirmOverride,requestReadiness,confirmHospital,declineHospital,setDeclineReason,updateHospital,refreshHospitalData,togglePrep,startNavigation,markArrived,setHandoffNote,confirmHandoff,closeCase,copyHandoffBrief,resetDemo,loadDemoScenario,openRole,setAuditOpen,openScenarioLab,loadScenario,clearScenario,mapFrameLoaded,reviewRouteAlternatives,acknowledgeRouteAlert,togglePresentation};
applyRoleFromUrl();
render();
bootstrapBackend();
})();
</script>
