<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VITALINK 2076 — QA Audited Emergency MVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B1F33;--navy2:#123A56;--blue:#1976A3;--teal:#18A7B8;--teal2:#33C4CC;
  --red:#D94242;--orange:#E38B2C;--green:#2E8B68;--bg:#F5F8FA;--card:#FFFFFF;
  --text:#17232C;--muted:#6B7C87;--line:#DDE6EA;--soft:#EEF3F5;
  --shadow:0 18px 55px rgba(11,31,51,.08);--shadow2:0 8px 24px rgba(11,31,51,.055);
  --r:18px;--rs:11px
}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#FBFDFE 0,#F3F7F9 100%);color:var(--text);font-family:Inter,"IBM Plex Sans Arabic",sans-serif}
html[lang=ar] body{font-family:"IBM Plex Sans Arabic",Inter,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}
.shell{display:flex;min-height:100vh}

/* SIDEBAR */
.sidebar{position:fixed;inset:0 auto 0 0;width:278px;padding:25px 18px;color:#fff;z-index:40;
background:radial-gradient(circle at 18% 0,rgba(24,167,184,.17),transparent 28%),linear-gradient(180deg,#0B2032,#071725);
box-shadow:18px 0 46px rgba(6,23,37,.09)}
html[dir=rtl] .sidebar{inset:0 0 0 auto;box-shadow:-18px 0 46px rgba(6,23,37,.09)}
.brand{display:flex;align-items:center;gap:12px;padding:2px 6px 22px}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,var(--teal),var(--blue));position:relative;box-shadow:0 10px 25px rgba(24,167,184,.22)}
.logo:before,.logo:after{content:"";position:absolute;background:#fff;border-radius:2px}
.logo:before{width:24px;height:5px;left:10px;top:20px}.logo:after{width:5px;height:24px;left:20px;top:10px}
.brand b{font-size:21px}.brand b span{color:#72E4EA}.brand small{display:block;margin-top:3px;color:#89A5B6;font-size:9px;letter-spacing:1px;text-transform:uppercase}
.role{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px;margin-bottom:17px}
.role label{display:block;color:#809AAA;font-size:9px;text-transform:uppercase;font-weight:800;letter-spacing:1px}
.role select{width:100%;margin-top:8px;background:#102A41;color:#fff;border:1px solid #31506A;border-radius:9px;padding:10px}
.navTitle{padding:7px 10px;color:#6C879A;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px}
.nav button{width:100%;border:0;background:transparent;color:#B8CBD8;display:flex;align-items:center;gap:10px;text-align:left;padding:11px 12px;border-radius:11px;margin:3px 0;font-size:11px;font-weight:700}
html[dir=rtl] .nav button{text-align:right}
.nav button.active,.nav button:hover{background:linear-gradient(90deg,rgba(24,167,184,.13),rgba(255,255,255,.035));color:#fff}
html[dir=rtl] .nav button.active,html[dir=rtl] .nav button:hover{background:linear-gradient(270deg,rgba(24,167,184,.13),rgba(255,255,255,.035))}
.nicon{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.055);display:grid;place-items:center;flex:0 0 auto}
.nav button.active .nicon{background:rgba(24,167,184,.15);color:#72E4EA}
.sidefoot{position:absolute;left:18px;right:18px;bottom:18px;border-top:1px solid rgba(255,255,255,.07);padding-top:11px;color:#708A9D;font-size:9px;line-height:1.6}

/* MAIN */
.main{margin-left:278px;width:calc(100% - 278px)}
html[dir=rtl] .main{margin-left:0;margin-right:278px}
.topbar{height:76px;position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}
.topbar h1{margin:0;font-size:18px}.sub{font-size:10px;color:var(--muted);margin-top:4px}
.topActions{display:flex;align-items:center;gap:8px}.lang{display:flex;background:#EEF3F5;border:1px solid var(--line);border-radius:10px;padding:3px}
.lang button{border:0;background:transparent;padding:7px 10px;border-radius:7px;font-size:10px;font-weight:800;color:#63727B}
.lang button.active{background:#fff;color:var(--navy);box-shadow:var(--shadow2)}
.online{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:999px;background:#EAF7F0;color:#1D6C4D;font-size:9px;font-weight:800}
.online:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(46,139,104,.12)}
.demo{padding:7px 10px;border-radius:999px;background:#F0F4F6;color:#5E6C74;font-size:9px;font-weight:800}
.content{padding:28px}

/* SHARED */
.pageHead{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:18px}
.pageHead h2{margin:0;font-size:27px;letter-spacing:-.25px}.pageHead p{max-width:780px;margin:7px 0 0;color:var(--muted);font-size:11px;line-height:1.7}
.grid{display:grid;gap:15px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow2)}.card h3{margin:0 0 13px;font-size:14px}
.label{font-size:9px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:1px}html[dir=rtl] .label{letter-spacing:0}
.value{font-size:29px;font-weight:800;line-height:1.08;margin-top:6px}.small{font-size:10px;color:var(--muted);line-height:1.55}
.badge{display:inline-flex;align-items:center;gap:5px;padding:6px 9px;border-radius:999px;font-size:9px;font-weight:800;white-space:nowrap}
.bRed{background:#FDECEC;color:#A92F2F}.bOrange{background:#FFF2DF;color:#995B0C}.bGreen{background:#E9F7EF;color:#1D6C4D}.bBlue{background:#E9F5F8;color:#15677E}.bGray{background:#EEF2F4;color:#5E6A72}
.btn{border:0;border-radius:10px;padding:10px 14px;font-size:10px;font-weight:800;transition:.18s ease}
.btn:hover{transform:translateY(-1px)}.btn.primary{background:linear-gradient(135deg,var(--navy2),#1C4C6D);color:#fff;box-shadow:0 8px 18px rgba(18,58,86,.17)}
.btn.teal{background:linear-gradient(135deg,var(--teal),#128C9F);color:#fff;box-shadow:0 8px 18px rgba(24,167,184,.17)}
.btn.danger{background:var(--red);color:#fff;box-shadow:0 8px 18px rgba(217,66,66,.16)}
.btn.ghost{background:#EDF3F5;color:#29414E}.btn.outline{background:#fff;color:var(--navy2);border:1px solid var(--line)}
.btn.successBtn{background:var(--green);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.field{margin-bottom:12px}.field label{display:block;font-size:10px;font-weight:700;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid #D1DCE2;border-radius:10px;background:#fff;color:var(--text);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#38A7BA;box-shadow:0 0 0 3px rgba(24,167,184,.12)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px dashed #E4EAED;font-size:11px}.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}.kv span:last-child{font-weight:800;text-align:right}html[dir=rtl] .kv span:last-child{text-align:left}
.notice{padding:11px 13px;border-radius:10px;font-size:10px;line-height:1.55;margin-top:11px}.info{background:#EAF6F8;color:#165E71}.warn{background:#FFF4E6;color:#81500E}.dangerN{background:#FFF0F0;color:#8E2B2B}.successN{background:#EAF7F0;color:#1C684A}
.ok{color:var(--green)!important}.bad{color:var(--red)!important}.orangeText{color:var(--orange)!important}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.divider{height:1px;background:var(--line);margin:16px 0}

/* WORKFLOW */
.workflow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:17px}
.wstep{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 11px;box-shadow:0 5px 16px rgba(11,31,51,.04)}
.wstep b{display:block;font-size:10px}.wstep span{display:block;font-size:8px;color:var(--muted);margin-top:3px}
.wstep.done{border-color:#C1DEE2;background:#F5FBFC}.wstep.done b{color:#0F7380}.wstep.current{border-color:var(--teal);background:#EEF9FA;box-shadow:0 0 0 3px rgba(24,167,184,.08)}.wstep.current b{color:#0B7180}

/* PATIENT */
.hero{display:grid;grid-template-columns:1.08fr .92fr;gap:15px}
.heroBox{min-height:360px;border-radius:24px;padding:31px;color:#fff;position:relative;overflow:hidden;background:radial-gradient(circle at 90% 10%,rgba(113,226,234,.17),transparent 28%),linear-gradient(145deg,#0D2235,#153F5D);box-shadow:var(--shadow)}
html[dir=rtl] .heroBox{background:radial-gradient(circle at 10% 10%,rgba(113,226,234,.17),transparent 28%),linear-gradient(145deg,#0D2235,#153F5D)}
.heroBox h2{font-size:36px;line-height:1.14;margin:10px 0 12px}.heroBox p{color:#C5D7E2;font-size:12px;line-height:1.78;max-width:610px}
.emergencyBtn{margin-top:18px;border:0;border-radius:12px;padding:14px 18px;background:var(--red);color:#fff;font-weight:800;box-shadow:0 10px 24px rgba(217,66,66,.24)}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:24px;color:#8FAFC1;font-size:9px}.flow b{color:#fff}
.presetGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.preset{border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px;font-size:10px;font-weight:700;text-align:start}
.preset.active{border-color:#36A8BC;background:#EDFAFD;color:#12667A}.voice.listening{background:#FFF0F0;color:#9B2E2E}
.confirmHero{background:linear-gradient(145deg,#0E283B,#123A56);color:#fff;border-radius:22px;padding:25px}.confirmHero h3{font-size:22px;margin:7px 0}.confirmHero p{color:#AFC4D0;font-size:11px;line-height:1.65}

/* DISPATCH */
.dispatchPanel{background:linear-gradient(145deg,#0B1F33,#123A56);border:1px solid #27495F;color:#F5FBFD;border-radius:20px;padding:21px;box-shadow:0 18px 50px rgba(11,31,51,.15)}
.dispatchPanel .label,.dispatchPanel .small,.dispatchPanel .kv span:first-child{color:#91A9B7}.dispatchPanel .kv{border-color:#29495D}
.unitCard{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid #2B5366;background:rgba(255,255,255,.045);border-radius:14px;margin-top:10px}
.unitIcon{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;background:rgba(24,167,184,.14);color:#64DDE2;font-size:20px;font-weight:800}.unitMeta{flex:1}.unitMeta b{display:block;font-size:13px}.unitMeta small{display:block;color:#8CA8B6;font-size:9px;margin-top:4px}
.readyPill{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;background:rgba(46,139,104,.14);border:1px solid rgba(46,139,104,.38);color:#6CD4AB;font-size:9px;font-weight:800}.readyPill:before{content:"";width:6px;height:6px;border-radius:50%;background:#6CD4AB}
.dispatchStats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.dispatchStat{padding:12px;border-bottom:1px solid #29495D}.dispatchStat span{display:block;color:#8DA6B5;font-size:9px}.dispatchStat strong{display:block;color:#F6FBFC;font-size:20px;margin-top:4px}
.bigAction{width:100%;border:0;border-radius:12px;padding:14px 16px;background:linear-gradient(135deg,#24B8C5,#18A7B8);color:#fff;font-weight:800;box-shadow:0 10px 28px rgba(24,167,184,.22)}
.protocol{margin-top:14px;padding:14px;border:1px solid #29495D;background:rgba(255,255,255,.035);border-radius:13px;color:#9FB5C1;font-size:10px;line-height:1.55}.protocol b{display:block;color:#F2F8FA;margin-bottom:4px}

/* EMS */
.emsLayout{display:grid;grid-template-columns:.95fr 1.05fr;gap:15px}
.smartPanel{background:radial-gradient(circle at 92% 8%,rgba(24,167,184,.16),transparent 28%),linear-gradient(145deg,#0B1F33,#123A56);border:1px solid #294C61;color:#F4FBFD;border-radius:20px;padding:22px;box-shadow:0 18px 50px rgba(11,31,51,.16)}
.smartTop{display:flex;align-items:flex-start;justify-content:space-between;gap:15px}.smartKicker{color:#62D8DE;font-size:10px;font-weight:700}.smartTitle{font-size:24px;font-weight:800;margin:6px 0 0}
.match{min-width:95px;padding:11px 12px;border:1px solid #2C596B;background:rgba(24,167,184,.09);border-radius:14px;text-align:center}.match span{display:block;color:#99B2BF;font-size:9px}.match strong{display:block;color:#65DDE2;font-size:28px;line-height:1.1;margin-top:3px}
.recHospital{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:15px;padding:15px;border:1px solid #2B5365;background:rgba(255,255,255,.045);border-radius:14px}
.hospitalIcon{width:49px;height:49px;border-radius:13px;display:grid;place-items:center;background:rgba(24,167,184,.14);color:#63D7DE;font-size:20px;font-weight:900}
.acceptPill{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;background:rgba(46,139,104,.14);border:1px solid rgba(46,139,104,.4);color:#69D3AA;font-size:9px;font-weight:800}
.acceptPill:before{content:"";width:6px;height:6px;border-radius:50%;background:#69D3AA}
.why{margin-top:14px;color:#BED0D9;font-size:10px;line-height:1.7}.reasonItem{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.07)}.reasonItem:last-child{border-bottom:0}.reasonCheck{color:#67D7B1;font-weight:900}
.sync{margin-top:13px;padding:12px;border-radius:12px;background:rgba(24,167,184,.08);border:1px solid rgba(24,167,184,.25)}.syncTop{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#65DDE2;font-size:9px;font-weight:800}.pulse{width:8px;height:8px;border-radius:50%;background:#18A7B8;box-shadow:0 0 0 5px rgba(24,167,184,.10)}
.reqState{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:7px 10px;border-radius:999px;font-size:9px;font-weight:800}.reqState.wait{background:rgba(227,139,44,.13);color:#F1B96B;border:1px solid rgba(227,139,44,.28)}.reqState.ready{background:rgba(46,139,104,.14);color:#70D4AD;border:1px solid rgba(46,139,104,.32)}.reqState.none{background:rgba(255,255,255,.07);color:#B6C9D3;border:1px solid rgba(255,255,255,.10)}
.hospitalList{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.hcard{position:relative}.hcard.recommended{border:2px solid var(--teal)}.tag{position:absolute;right:13px;top:13px;background:#E7F9F8;color:#0E737D;padding:6px 8px;border-radius:999px;font-size:8px;font-weight:800}html[dir=rtl] .tag{right:auto;left:13px}
.score{font-size:31px;font-weight:800;margin:3px 0 8px}.cap{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #EDF1F3;font-size:10px}
.failReason{margin-top:9px;padding:9px 10px;border-radius:9px;background:#FFF0F0;color:#8E2B2B;font-size:9px;line-height:1.5}

/* MAP */
.mapPanel{background:#0B1F33;border:1px solid #29495D;border-radius:20px;overflow:hidden;box-shadow:0 18px 50px rgba(11,31,51,.14)}
.mapHead{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;background:#10283D;border-bottom:1px solid #29495D;color:#fff}.mapHead h3{margin:0}.mapHead .small{color:#90A8B6}
.mapFrameWrap{position:relative;background:#102638}.mapFrame{display:block;width:100%;height:430px;border:0;filter:saturate(.82) contrast(1.03) brightness(.95)}
.mapOverlay{position:absolute;top:15px;right:15px;width:290px;background:rgba(11,31,51,.94);border:1px solid #2B5065;border-radius:14px;padding:13px;color:#F3FAFC;box-shadow:var(--shadow)}
html[dir=rtl] .mapOverlay{right:auto;left:15px}.mapOverlay .label,.mapOverlay .kv span:first-child{color:#90A8B6}.mapOverlay .kv{border-color:#29495D}
.routeSummary{padding:18px;background:linear-gradient(180deg,#10283D,#0D2234);border-top:1px solid #29495D;color:#fff}.routeHospitalHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.routeHospitalHead h3{font-size:18px;margin:3px 0 0}.routeIcon{width:48px;height:48px;border-radius:13px;background:rgba(24,167,184,.14);display:grid;place-items:center;color:#62D8DE;font-size:22px}
.routeMetrics{display:grid;grid-template-columns:1fr 1fr;gap:12px}.routeMetric{border:1px solid #2A4B60;background:#102A40;border-radius:13px;padding:14px}.routeMetric span{display:block;color:#8DA7B5;font-size:9px}.routeMetric strong{display:block;font-size:26px;color:#F7FBFC;margin-top:4px}
.routeLine{display:flex;justify-content:space-between;gap:12px;align-items:center;color:#9FB3BD;font-size:10px;margin:14px 0}.traffic{color:#59C6A0;font-weight:700}
.mapCta{width:100%;border:0;border-radius:12px;padding:14px;background:linear-gradient(135deg,#25B8C5,#18A7B8);color:#fff;font-weight:800;box-shadow:0 10px 28px rgba(24,167,184,.22)}
.mapCta:disabled{opacity:.38}.mapsLink{display:inline-flex;margin-top:10px;color:#68D6DD;font-size:9px;font-weight:800}
.enroute{margin-top:12px;padding:10px 12px;border-radius:10px;background:rgba(24,167,184,.10);border:1px solid rgba(24,167,184,.28);color:#72DCE2;font-size:9px;font-weight:700}

/* HOSPITAL */
.readinessBar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px}.fresh{display:inline-flex;align-items:center;gap:6px;font-size:9px;color:var(--green);font-weight:800}.fresh:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}
.incomingRequest{border:2px solid var(--teal);box-shadow:0 15px 35px rgba(24,167,184,.10)}.requestHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.requestBadge{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:#FFF5E9;color:#9B620F;border:1px solid #F4D8AF;font-size:9px;font-weight:800}.requestBadge.ready{background:#EAF7F0;color:#1D6C4D;border-color:#C2E4D2}
.declineReasons{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.declineReason{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;text-align:start;font-size:9px;font-weight:700}.declineReason.active{border-color:var(--orange);background:#FFF7EC;color:#8C580E}
.metricRow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{border:1px solid var(--line);border-radius:11px;padding:10px;text-align:center}.metric b{display:block;font-size:17px}.metric span{font-size:8px;color:var(--muted)}
.progress{height:7px;background:#EDF1F3;border-radius:999px;overflow:hidden;margin-top:6px}.progress span{display:block;height:100%;border-radius:999px}.pg{background:var(--green)}.po{background:var(--orange)}.pr{background:var(--red)}

/* MICRO-INTERACTION */
.analysisOverlay{position:fixed;inset:0;background:rgba(7,23,37,.62);backdrop-filter:blur(5px);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.analysisBox{width:min(470px,94vw);background:#fff;border-radius:20px;padding:24px;box-shadow:0 30px 90px rgba(0,0,0,.22)}.analysisBox h3{margin:0 0 6px}.analysisBox p{margin:0;color:var(--muted);font-size:10px}
.analysisSteps{margin-top:17px}.astep{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #EDF1F3;font-size:10px}.astep:last-child{border-bottom:0}.adot{width:11px;height:11px;border-radius:50%;background:#DDE6EA;box-shadow:0 0 0 4px #F3F6F8}.astep.active .adot{background:var(--teal);box-shadow:0 0 0 5px rgba(24,167,184,.12)}.astep.done .adot{background:var(--green)}.astep.active{font-weight:800;color:#0E7180}
.toast{position:fixed;right:22px;bottom:22px;z-index:90;width:min(380px,calc(100vw - 44px));background:#0B1F33;color:#fff;border:1px solid #29495D;border-radius:14px;padding:14px 15px;box-shadow:0 18px 50px rgba(11,31,51,.22);animation:slideUp .25s ease}.toast b{display:block;font-size:11px}.toast span{display:block;color:#9FB5C1;font-size:9px;margin-top:4px;line-height:1.5}html[dir=rtl] .toast{right:auto;left:22px}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* TIMELINE */
.timeline{position:relative;padding-left:17px}html[dir=rtl] .timeline{padding-left:0;padding-right:17px}.timeline:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:#E3EAED}html[dir=rtl] .timeline:before{left:auto;right:5px}

const KEY="vitalink_v30_backend";

function cloneState(v){try{return structuredClone(v)}catch(e){return JSON.parse(JSON.stringify(v))}}
function sharedStateSnapshot(){
  const x=cloneState(S);

}
function mergeSharedState(next){
  if(!next||typeof next!=="object"||!next.case)return null;
  const localUI={screen:S.screen,lang:S.lang,analysisStage:S.analysisStage,toast:S.toast};
  const merged={...S,...next};

  return merged

function normalizeSharedState(next){
  if(!next||typeof next!=="object"||!next.case)return next;
  if(next.case.requestFor===undefined)next.case.requestFor="self";
  if(!next.case.prearrival)next.case.prearrival={team:false,bay:false,monitor:false};
  if(next.case.readinessRequest===undefined)next.case.readinessRequest=null;
  if(next.case.hospitalConfirmed===undefined)next.case.hospitalConfirmed=false;
  if(next.case.override===undefined)next.case.override=null;
  if(next.case.recommendationChange===undefined)next.case.recommendationChange=null;
  if(next.case.routeAlert===undefined)next.case.routeAlert=null;
  if(!next.case.milestones)next.case.milestones={enroute:null,arrived:null,handoff:null,closed:null};
  if(next.case.handoffBriefAt===undefined)next.case.handoffBriefAt=null;

  if(!next.scenarioProgress)next.scenarioProgress={};

function adoptRemoteState(next,revision=null,source="remote"){
  next=normalizeSharedState(cloneState(next));

  syncingRemote=true;
  const merged=mergeSharedState(next);
  if(merged)S=merged;
  if(Number.isFinite(Number(revision)))serverRevision=Math.max(serverRevision,Number(revision));

  const el=document.querySelector(".liveSyncBanner");

function localFallbackPublish(reason,state){
  const packet={type:"VITALINK_STATE",source:TAB_ID,reason,ts:Date.now(),state};
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}

function publishState(reason="update"){
  if(syncingRemote)return;
  const shared=sharedStateSnapshot();
  localFallbackPublish(reason,shared);
  queueServerPush(reason,shared)
}
function queueServerPush(reason,state=sharedStateSnapshot()){
  pendingServerPush={reason,state,queuedAt:Date.now()};
  flushServerPush()
}
async function flushServerPush(){
  if(pushInFlight||!pendingServerPush||location.protocol==="file:")return;
  if(!serverConnected){scheduleBackendReconnect();return}
  const job=pendingServerPush;pendingServerPush=null;pushInFlight=true;
  try{
    const res=await fetch("/api/state",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({
      state:job.state,expectedRevision:serverRevision,reason:job.reason,source:TAB_ID
    })});
    const data=await res.json();
    if(res.status===409){
      serverRevision=Number(data.serverRevision||serverRevision);
      pendingServerPush=null;
      if(data.state)adoptRemoteState(data.state,serverRevision,"conflict");
      showToast("Server conflict prevented","تم منع تعارض على السيرفر","A newer update already existed. VITALINK restored the latest server state instead of overwriting it.","كان هناك تحديث أحدث. استعاد VITALINK أحدث حالة من السيرفر بدل الكتابة فوقها.");
    }else if(!res.ok){
      throw new Error(data.error||`HTTP ${res.status}`)
    }else{
      serverConnected=true;backendEverConnected=true;serverLastError="";
      serverRevision=Number(data.serverRevision||serverRevision);
    }
  }catch(e){
    serverConnected=false;serverLastError=String(e?.message||e);
    if(!pendingServerPush)pendingServerPush=job;
    scheduleBackendReconnect()
  }finally{
    pushInFlight=false;
    if(pendingServerPush&&serverConnected)setTimeout(flushServerPush,0)
  }
}
function backendWsUrl(){
  if(location.protocol!=="http:"&&location.protocol!=="https:")return null;
  return `${location.protocol==="https:"?"wss":"ws"}://${location.host}/ws?client=${encodeURIComponent(TAB_ID)}`
}
function connectWebSocket(){
  const url=backendWsUrl();if(!url)return;
  try{if(wsClient)wsClient.close()}catch(e){}
  try{
    wsClient=new WebSocket(url);
    wsClient.onopen=()=>{serverConnected=true;backendEverConnected=true;serverLastError="";reconnectAttempt=0;render()};
    wsClient.onmessage=e=>{
      try{
        const p=JSON.parse(e.data);
        if(p.type==="hello"){
          serverConnected=true;backendEverConnected=true;serverRevision=Number(p.serverRevision||0);
          if(p.state)adoptRemoteState(p.state,serverRevision,"server-hello");
          render();return
        }
        if(p.type==="state_updated"){
          serverConnected=true;backendEverConnected=true;
          serverRevision=Math.max(serverRevision,Number(p.serverRevision||0));
          if(p.source!==TAB_ID&&p.state)adoptRemoteState(p.state,p.serverRevision,"server-ws");
          else render()
        }
      }catch(err){}
    };
    wsClient.onerror=()=>{serverLastError="WebSocket connection error"};
    wsClient.onclose=()=>{serverConnected=false;render();scheduleBackendReconnect()}
  }catch(e){serverConnected=false;serverLastError=String(e?.message||e);scheduleBackendReconnect()}
}
function scheduleBackendReconnect(){
  if(location.protocol==="file:"||wsRetryTimer)return;
  const delay=Math.min(10000,1000*Math.pow(1.7,reconnectAttempt++));
  wsRetryTimer=setTimeout(async()=>{wsRetryTimer=null;await bootstrapBackend(true)},delay)
}
async function bootstrapBackend(isReconnect=false){
  if(location.protocol!=="http:"&&location.protocol!=="https:")return;
  try{
    const res=await fetch("/api/state",{cache:"no-store"});
    if(!res.ok)throw new Error(`HTTP ${res.status}`);
    const data=await res.json();
    const remoteRev=Number(data.serverRevision||0),previousRev=serverRevision;
    serverConnected=true;backendEverConnected=true;serverLastError="";reconnectAttempt=0;
    if(data.state){
      if(pendingServerPush&&remoteRev===previousRev){
        serverRevision=remoteRev;
      }else{
        if(pendingServerPush&&remoteRev>previousRev){
          pendingServerPush=null;
          showToast("Server state restored","تم استعادة حالة السيرفر","The server changed while this client was disconnected. The newer server state was preserved.","تغيرت حالة السيرفر أثناء انقطاع هذا العميل، وتم الحفاظ على الحالة الأحدث.")
        }
        serverRevision=remoteRev;adoptRemoteState(data.state,remoteRev,"bootstrap")
      }
    }else{
      serverRevision=remoteRev;
      if(!pendingServerPush)pendingServerPush={reason:"bootstrap",state:sharedStateSnapshot(),queuedAt:Date.now()}
    }
    connectWebSocket();
    if(pendingServerPush)flushServerPush();
    render()
  }catch(e){
    serverConnected=false;serverLastError=String(e?.message||e);render();scheduleBackendReconnect()
  }
}

function scenarioChecks(){

      check(T("Hospital confirmed","أكد المستشفى"),S.case.hospitalConfirmed||st>=order.indexOf("EN_ROUTE")),
      check(T("Case closed","تم إغلاق الحالة"),S.case.status==="CASE_CLOSED")
    ]
  }

      check(T("EMS case active","حالة الإسعاف نشطة"),S.case.assigned),
      check(T("Higher-acuity flag","مؤشر حدة أعلى"),caseNeeds().highAcuity),
      check(T("Hospital analysis completed","اكتمل تحليل المستشفى"),st>=order.indexOf("HOSPITAL_MATCHED")),
      check(T("Receiving hospital confirmed","تم تأكيد المستشفى المستقبل"),S.case.hospitalConfirmed||st>=order.indexOf("EN_ROUTE"))
    ]
  }
  if(id==="bleeding_high"){
    return [
      check(T("Trauma capability required","قدرة الإصابات مطلوبة"),requiredType()==="trauma"),
      check(T("Higher-acuity flag","مؤشر حدة أعلى"),caseNeeds().highAcuity),
      check(T("Hospital match completed","اكتملت مطابقة المستشفى"),st>=order.indexOf("HOSPITAL_MATCHED")),
      check(T("Readiness confirmed","تم تأكيد الجاهزية"),S.case.hospitalConfirmed||st>=order.indexOf("EN_ROUTE"))

  if(id==="no_beds"){
    const none=S.hospitals.every(h=>!h.accept||h.beds<=0);
    return [
      check(T("All hospitals unavailable","كل المستشفيات غير متاحة"),none),
      check(T("Analysis completed","اكتمل التحليل"),st>=order.indexOf("HOSPITAL_MATCHED")),

function readinessAgeMs(h){return Math.max(0,Date.now()-(h.lastUpdated||0))}
function readinessFreshness(h){
  const age=readinessAgeMs(h);
  if(age<=5*60*1000)return {key:"fresh",label:T("Fresh","حديثة"),detail:T("Updated within 5 min","تم التحديث خلال 5 دقائق")};
  if(age<=10*60*1000)return {key:"aging",label:T("Aging","تتقدم بالعمر"),detail:T("Older than 5 min","أقدم من 5 دقائق")};
  return {key:"stale",label:T("Stale","قديمة"),detail:T("Older than 10 min","أقدم من 10 دقائق")};
}
function hospitalDataConfidence(h){
  const f=readinessFreshness(h);
  return f.key==="fresh"?{key:"high",label:T("High","عالية")}:f.key==="aging"?{key:"medium",label:T("Medium","متوسطة")}:{key:"low",label:T("Low","منخفضة")}
}
function allReadinessStale(){return S.hospitals.length>0&&S.hospitals.every(h=>readinessFreshness(h).key==="stale")}
function activeDestination(){return S.hospitals.find(h=>h.id===S.case.selected)||null}

  const info=syncInfo(),h=activeDestination(),fresh=h?readinessFreshness(h):{key:"fresh",detail:T("No active destination","لا توجد وجهة نشطة")};

function generateCaseId(){
  const d=new Date(),ymd=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
  let suffix="";
  try{suffix=crypto.randomUUID().replaceAll("-","").slice(0,6).toUpperCase()}catch(e){suffix=Math.random().toString(36).slice(2,8).toUpperCase()}
  return `VL-${ymd}-${suffix}`
}

function hasResolvedPatientLocation(){

  return !!raw&&raw!=="—"&&!/Location permission not granted|لم يتم منح إذن الموقع/i.test(raw)
}
function travelDistanceText(h){return hasResolvedPatientLocation()?`${h.distance} km`:T("Location unresolved","الموقع غير محدد")}

const STATE_GRAPH={
  DRAFT:["RECEIVED_911"],
  RECEIVED_911:["DISPATCHED"],
  DISPATCHED:["EMS_ASSIGNED"],
  EMS_ASSIGNED:["HOSPITAL_MATCHED"],
  HOSPITAL_MATCHED:["READINESS_REQUESTED"],
  READINESS_REQUESTED:["HOSPITAL_READY","HOSPITAL_MATCHED"],
  HOSPITAL_READY:["EN_ROUTE","HOSPITAL_MATCHED"],
  EN_ROUTE:["ARRIVED","HOSPITAL_MATCHED"],
  ARRIVED:["HANDOFF_COMPLETE"],
  HANDOFF_COMPLETE:["CASE_CLOSED"],
  CASE_CLOSED:[]
};
function canTransition(from,to){return from===to||(STATE_GRAPH[from]||[]).includes(to)}
function transitionWorkflow(next,reason=""){
  const from=S.case.status;
  if(!canTransition(from,next)){
    showToast("Action blocked by workflow","الإجراء موقوف حسب مسار العمل",`Cannot move from ${from} to ${next}. Complete the required previous step first.`,`لا يمكن الانتقال من ${from} إلى ${next}. أكمل الخطوة السابقة المطلوبة أولًا.`);
    return false
  }
  if(from!==next){S.case.status=next;S.case.revision=(S.case.revision||0)+1}
  return true
}
function guardStatus(allowed){
  if(allowed.includes(S.case.status))return true;
  showToast("Action unavailable at this stage","الإجراء غير متاح في هذه المرحلة",`Current stage: ${statusLabel()[0]}.`,`المرحلة الحالية: ${statusLabel()[0]}.`);
  return false
}

/* WORKFLOW */
const order=["DRAFT","RECEIVED_911","DISPATCHED","EMS_ASSIGNED","HOSPITAL_MATCHED","READINESS_REQUESTED","HOSPITAL_READY","EN_ROUTE","ARRIVED","HANDOFF_COMPLETE","CASE_CLOSED"];
function workflow(){
  const stageMap={
    DRAFT:-1,RECEIVED_911:0,DISPATCHED:0,EMS_ASSIGNED:1,
    HOSPITAL_MATCHED:2,READINESS_REQUESTED:2,HOSPITAL_READY:3,
    EN_ROUTE:4,ARRIVED:4,HANDOFF_COMPLETE:5,CASE_CLOSED:5
  };
  const current=stageMap[S.case.status]??-1;
  const steps=[
    T("911","911"),
    T("EMS","الإسعاف"),
    T("Hospital Match","مطابقة المستشفى"),
    T("Hospital Ready","جاهزية المستشفى"),
    T("Transport / Arrival","النقل / الوصول"),
    T("Handoff / Closed","التسليم / الإغلاق")
  ];
  return `<div class="workflow">${steps.map((x,i)=>{
    let cl=current>i?"done":current===i?"current":"";
    if(S.case.status==="CASE_CLOSED"&&i===5)cl="done current";
    return `<div class="wstep ${cl}"><b>${x}</b><span>${i+1}/6</span></div>`
  }).join("")}</div>`
}

function submitPatient(quick=false){
  if(!guardStatus(["DRAFT"]))return;
  if(!quick&&!S.case.name.trim()){showToast("Missing information","بيانات ناقصة","Enter the patient name first.","أدخل اسم المريض أولًا.");return}
  if(!quick&&!S.case.location.trim()){showToast("Location required","الموقع مطلوب","Use browser location or choose the Irbid demo location before sending the standard request.","استخدم موقع المتصفح أو اختر موقع إربد التجريبي قبل إرسال الطلب العادي.");return}
  if(quick&&!S.case.name.trim())S.case.name=T("Unknown patient","مريض غير معروف");
  if(quick&&!S.case.location.trim())S.case.location="—";
  ensureCaseId();S.case.created=true;

  log("Patient","Emergency request sent","تم إرسال طلب الطوارئ",hasResolvedPatientLocation()?"location available":"location unresolved");
  save();publishState("patient-submit");render()
}

function dispatchUnits(){
  return [
    {id:"Unit 03",en:"Civil Defense Unit 03",ar:"وحدة الدفاع المدني 03",areaEn:"Irbid Center",areaAr:"مركز إربد",eta:hasResolvedPatientLocation()?4:null,busy:!!S.scenarioFlags?.unit03Busy},

function recommendedUnit(){
  return dispatchUnits().filter(u=>!u.busy).sort((a,b)=>(a.eta??999)-(b.eta??999))[0]||null

function assignAmbulance(){
  if(!guardStatus(["RECEIVED_911"]))return;
  const u=recommendedUnit();
  if(!u){showToast("No ambulance available","لا توجد سيارة إسعاف متاحة","No response unit is available in this test state.","لا توجد وحدة استجابة متاحة في حالة الاختبار الحالية.");return}
  S.case.assigned=false;S.case.ambulance=u.id;
  if(!transitionWorkflow("DISPATCHED","911-dispatch"))return;
  log("911",`${u.id} dispatched`,`تم إرسال ${u.id}`,u.eta?`${u.eta} min`:T("ETA unavailable — location unresolved","وقت الوصول غير متاح — الموقع غير محدد"));
  saveRender();
  showToast("Dispatch sent","تم إرسال البلاغ",`Waiting for ${u.id} to acknowledge the case.`,`بانتظار تأكيد ${u.id} استلام الحالة.`)

function acknowledgeAmbulance(){
  if(!guardStatus(["DISPATCHED"]))return;
  S.case.assigned=true;
  if(!transitionWorkflow("EMS_ASSIGNED","ems-ack"))return;
  log(S.case.ambulance,"Case acknowledged by ambulance crew","أكد طاقم الإسعاف استلام الحالة");
  saveRender();
  showToast("Ambulance acknowledged","أكدت سيارة الإسعاف الاستلام","The case is now active on the paramedic interface.","أصبحت الحالة الآن نشطة على واجهة المسعف.")
}

/* MATCHING *//* MATCHING */

function parseBP(v){
  const m=String(v||"").trim().match(/^(\d{2,3})\s*\/\s*(\d{2,3})$/);
  return m?{sys:Number(m[1]),dia:Number(m[2])}:null
}
function validateVitals(){
  const v=S.case.vitals,errors=[];
  const bp=parseBP(v.bp);
  const hr=Number(v.hr),spo2=Number(v.spo2),temp=Number(v.temp),rr=Number(v.rr);
  if(!bp||bp.sys<50||bp.sys>250||bp.dia<25||bp.dia>160||bp.sys<=bp.dia)errors.push(T("Enter blood pressure in a valid format such as 120/80.","أدخل ضغط الدم بصيغة صحيحة مثل 120/80."));
  if(!Number.isFinite(hr)||hr<20||hr>250)errors.push(T("Heart rate must be between 20 and 250 bpm.","يجب أن يكون معدل النبض بين 20 و250 نبضة/دقيقة."));
  if(!Number.isFinite(spo2)||spo2<50||spo2>100)errors.push(T("SpO₂ must be between 50 and 100%.","يجب أن تكون SpO₂ بين 50 و100%."));
  if(v.temp!==""&&(!Number.isFinite(temp)||temp<30||temp>43))errors.push(T("Temperature must be between 30 and 43°C.","يجب أن تكون الحرارة بين 30 و43 درجة مئوية."));
  if(v.rr!==""&&(!Number.isFinite(rr)||rr<5||rr>60))errors.push(T("Respiratory rate must be between 5 and 60/min.","يجب أن يكون معدل التنفس بين 5 و60/دقيقة."));
  return errors
}
function assessmentCompleteness(){
  const v=S.case.vitals,keys=["bp","hr","spo2","temp","rr","con"];
  const done=keys.filter(k=>String(v[k]??"").trim()!=="").length;
  return Math.round(done/keys.length*100)
}
function caseNeeds(){
  const v=S.case.vitals,bp=parseBP(v.bp),spo2=Number(v.spo2),hr=Number(v.hr),rr=Number(v.rr);
  const specialty=requiredType();
  let highAcuity=false,reasons=[];
  if(Number.isFinite(spo2)&&spo2<92){highAcuity=true;reasons.push(T("Low oxygen saturation demo flag","مؤشر تجريبي لانخفاض تشبع الأكسجين"))}
  if(bp&&bp.sys<90){highAcuity=true;reasons.push(T("Low systolic pressure demo flag","مؤشر تجريبي لانخفاض الضغط الانقباضي"))}
  if(Number.isFinite(hr)&&(hr>130||hr<45)){highAcuity=true;reasons.push(T("Heart-rate demo flag","مؤشر تجريبي لمعدل النبض"))}
  if(Number.isFinite(rr)&&(rr>=30||rr<=8)){highAcuity=true;reasons.push(T("Respiratory-rate demo flag","مؤشر تجريبي لمعدل التنفس"))}
  if(v.con==="unresponsive"||v.con==="pain"){highAcuity=true;reasons.push(T("Reduced consciousness demo flag","مؤشر تجريبي لانخفاض الوعي"))}
  return {specialty,highAcuity,needsICU:highAcuity,minimumCapacity:highAcuity?70:45,reasons}
}
function vitalVisual(k){
  const v=S.case.vitals,bp=parseBP(v.bp),n=Number(v[k]);
  if(String(v[k]??"").trim()==="")return {cls:"",state:T("Not entered","غير مدخل")};
  if(k==="bp"){
    if(!bp)return {cls:"alert",state:T("Invalid","غير صحيح")};
    if(bp.sys<90)return {cls:"warn",state:T("Review","مراجعة")};
    return {cls:"ok",state:T("Captured","تم الإدخال")}
  }
  if(k==="spo2"){if(!Number.isFinite(n)||n<50||n>100)return {cls:"alert",state:T("Invalid","غير صحيح")};if(n<92)return {cls:"warn",state:T("Review","مراجعة")};return {cls:"ok",state:T("Captured","تم الإدخال")}}
  if(k==="hr"){if(!Number.isFinite(n)||n<20||n>250)return {cls:"alert",state:T("Invalid","غير صحيح")};if(n>130||n<45)return {cls:"warn",state:T("Review","مراجعة")};return {cls:"ok",state:T("Captured","تم الإدخال")}}
  if(k==="rr"){if(!Number.isFinite(n)||n<5||n>60)return {cls:"alert",state:T("Invalid","غير صحيح")};if(n>=30||n<=8)return {cls:"warn",state:T("Review","مراجعة")};return {cls:"ok",state:T("Captured","تم الإدخال")}}
  if(k==="temp"){if(!Number.isFinite(n)||n<30||n>43)return {cls:"alert",state:T("Invalid","غير صحيح")};return {cls:"ok",state:T("Captured","تم الإدخال")}}
  return {cls:"ok",state:T("Captured","تم الإدخال")}
}
function requiredType(){return ["chest","breath"].includes(S.case.emergency)?"cardiac":["trauma","bleed"].includes(S.case.emergency)?"trauma":"general"}
function hospitalScore(h){
  const needs=caseNeeds();
  const fit=needs.specialty==="general"?h.types.includes("general"):h.types.includes(needs.specialty);
  const bedRatio=Math.max(0,Math.min(1,h.beds/Math.max(1,h.total)));
  const capacityRatio=Math.max(0,Math.min(1,h.cap/100));
  const loadRatio=Math.max(0,Math.min(1,1-(h.cases/40))); // configured MVP load scale: 0-40 active cases
  const travelAvailable=hasResolvedPatientLocation();
  const distanceScore=travelAvailable?Math.max(0,Math.min(1,1-h.distance/15)):0;

  const breakdown={
    capability:fit?40:0,
    readiness:(h.accept?10:0)+(h.beds>0?5:0),
    capacity:Math.round(capacityRatio*12+bedRatio*8),
    load:Math.round(loadRatio*10),
    travel:Math.round(distanceScore*10),
    acuity:needs.highAcuity?(h.icu?5:0):5
  };
  const score=Object.values(breakdown).reduce((a,b)=>a+b,0);
  return {score,fit,needs,travelAvailable,breakdown,maxScore:100}
}

function ranked(){return S.hospitals.map(h=>({...h,...hospitalScore(h)})).sort((a,b)=>b.score-a.score)}
function bestHospital(){return ranked().find(h=>h.accept&&h.fit&&h.beds>0&&readinessFreshness(h).key!=="stale")||null}
function runAnalysis(){
  if(!guardStatus(["EMS_ASSIGNED","HOSPITAL_MATCHED","READINESS_REQUESTED"]))return;
  const errors=validateVitals();
  if(errors.length){showToast("Check vital signs","راجع العلامات الحيوية",errors[0],errors[0]);return}
  const startRevision=S.case.revision||0;
  S.analysisStage=1;render();
  setTimeout(()=>{if((S.case.revision||0)===startRevision){S.analysisStage=2;render()}},450);
  setTimeout(()=>{if((S.case.revision||0)===startRevision){S.analysisStage=3;render()}},900);
  setTimeout(()=>{
    if(!["EMS_ASSIGNED","HOSPITAL_MATCHED","READINESS_REQUESTED"].includes(S.case.status)){S.analysisStage=0;render();return}
    const b=bestHospital();S.case.selected=b?.id||null;S.case.lastRecommendation=b?.id||null;
    S.case.override=null;S.case.recommendationChange=null;S.case.milestones={enroute:null,arrived:null,handoff:null,closed:null};S.case.handoffBriefAt=null;S.case.handoffNote="";
    if(!transitionWorkflow("HOSPITAL_MATCHED","hospital-analysis")){S.analysisStage=0;return}
    S.case.readinessRequest=null;S.case.hospitalConfirmed=false;S.analysisStage=0;
    log("VITALINK","Hospital match recalculated from field assessment","تمت إعادة حساب مطابقة المستشفى من التقييم الميداني",b?`score ${b.score}/100`:"manual escalation");
    saveRender();
  },1350)
}
function selectHospital(id){
  if(!guardStatus(["HOSPITAL_MATCHED"]))return;
  S.case.selected=id;S.case.readinessRequest=null;S.case.hospitalConfirmed=false;saveRender()
}
function requestReadiness(id){
  if(!guardStatus(["HOSPITAL_MATCHED"]))return;
  const h=S.hospitals.find(x=>x.id===id);if(!h)return;
  if(readinessFreshness(h).key==="stale"){
    if(S.scenario?.id==="stale_readiness"){S.scenarioProgress.staleBlocked=true;save();publishState("scenario-progress")}
    showToast("Readiness data are stale","بيانات الجاهزية قديمة","Refresh hospital readiness before requesting confirmation.","حدّث جاهزية المستشفى قبل طلب التأكيد.");return
  }
  if(!h.accept||h.beds<=0){showToast("Hospital unavailable","المستشفى غير متاح","This hospital cannot receive the request in its current readiness state.","لا يستطيع هذا المستشفى استقبال الطلب في حالة الجاهزية الحالية.");return}
  S.case.selected=id;S.case.readinessRequest=id;S.case.hospitalConfirmed=false;
  if(!transitionWorkflow("READINESS_REQUESTED","readiness-request"))return;
  log("Paramedic","Hospital readiness requested","تم إرسال طلب جاهزية المستشفى",`${id} • readiness confidence ${hospitalDataConfidence(h).label}`);
  saveRender();showToast("Readiness request sent","تم إرسال طلب الجاهزية","Waiting for hospital confirmation.","بانتظار تأكيد المستشفى.")
}

function confirmHospital(id){
  if(!guardStatus(["READINESS_REQUESTED"]))return;
  const h=S.hospitals.find(x=>x.id===id);if(!h||S.case.readinessRequest!==id)return;
  if(readinessFreshness(h).key==="stale"){showToast("Readiness update required","تحديث الجاهزية مطلوب","Refresh hospital readiness before confirming the receiving request.","حدّث جاهزية المستشفى قبل تأكيد طلب الاستقبال.");return}
  if(!h.accept||h.beds<=0){showToast("Cannot confirm readiness","لا يمكن تأكيد الجاهزية","Update beds and acceptance status before confirming this request.","حدّث عدد الأسرة وحالة استقبال الحالات قبل تأكيد الطلب.");return}
  S.case.selected=id;S.case.readinessRequest=id;S.case.hospitalConfirmed=true;
  if(!transitionWorkflow("HOSPITAL_READY","hospital-confirm"))return;
  S.case.routeAlert=null;S.case.prearrival={team:false,bay:false,monitor:false};S.case.milestones={enroute:null,arrived:null,handoff:null,closed:null};S.case.handoffBriefAt=now();S.case.handoffNote="";
  log("Hospital","Bed and readiness confirmed","تم تأكيد السرير والجاهزية",`readiness confidence ${hospitalDataConfidence(h).label}`);
  saveRender();showToast("Hospital confirmed","أكد المستشفى","Bed and emergency readiness are confirmed. EMS navigation is now unlocked.","تم تأكيد السرير وجاهزية الطوارئ. أصبح التوجيه متاحًا للمسعف.")
}

function declineHospital(id){
  if(!guardStatus(["READINESS_REQUESTED"]))return;
  const h=S.hospitals.find(x=>x.id===id);if(!h||S.case.readinessRequest!==id)return;
  const reasons={no_beds:T("No available beds","لا توجد أسرة متاحة"),overload:T("ED overload","ضغط مرتفع على الطوارئ"),capability:T("Required capability unavailable","القدرة المطلوبة غير متوفرة"),other:T("Other operational reason","سبب تشغيلي آخر")};
  if(S.declineReason==="no_beds")h.beds=0;
  if(S.declineReason==="overload")h.cap=Math.min(h.cap,30);
  h.accept=false;h.lastUpdated=Date.now();
  log("Hospital","Readiness request declined","تم رفض طلب الجاهزية",reasons[S.declineReason]);
  S.case.hospitalConfirmed=false;S.case.readinessRequest=null;S.case.prearrival={team:false,bay:false,monitor:false};S.case.milestones={enroute:null,arrived:null,handoff:null,closed:null};S.case.handoffBriefAt=null;S.case.handoffNote="";
  const old=S.case.selected,newBest=bestHospital();S.case.selected=newBest?.id||null;
  if(!transitionWorkflow("HOSPITAL_MATCHED","hospital-decline"))return;
  if(old!==S.case.selected){S.case.lastRecommendation=S.case.selected;S.case.override=null;S.case.recommendationChange={from:old,to:S.case.selected,reason:"hospital_declined",time:now()};log("VITALINK","Hospital recommendation changed after decline","تغيرت توصية المستشفى بعد الرفض",`${old} → ${S.case.selected||"manual escalation"}`)}
  saveRender();showToast("Hospital status changed","تغيرت حالة المستشفى","The hospital declined this request. VITALINK recalculated the recommended destination.","رفض المستشفى هذا الطلب. أعاد VITALINK حساب الوجهة الموصى بها.")
}

function togglePrep(k){
  if(!S.case.hospitalConfirmed)return;
  S.case.prearrival[k]=!S.case.prearrival[k];
  log("Hospital",`Pre-arrival task ${S.case.prearrival[k]?"completed":"reopened"}`,S.case.prearrival[k]?"تم إنجاز مهمة التحضير قبل الوصول":"تم إعادة فتح مهمة التحضير قبل الوصول",k);
  saveRender()
}
function setDeclineReason(v){S.declineReason=v;saveRender()}
function updateHospital(id,k,v){
  const h=S.hospitals.find(x=>x.id===id);if(!h)return;
  const oldSelected=S.case.selected;
  if(["beds","cap","cases"].includes(k)){
    if(String(v).trim()===""||!Number.isFinite(Number(v))){showToast("Valid value required","قيمة صحيحة مطلوبة","Enter a numeric operational value.","أدخل قيمة تشغيلية رقمية صحيحة.");render();return}
    h[k]=Number(v)
  }else h[k]=(v==="true"?true:v==="false"?false:v);
  if(k==="beds")h.beds=Math.max(0,Math.min(h.total,h.beds));
  if(k==="cap")h.cap=Math.max(0,Math.min(100,h.cap));
  if(k==="cases")h.cases=Math.max(0,h.cases);
  h.lastUpdated=Date.now();
  log("Hospital","Hospital readiness updated","تم تحديث جاهزية المستشفى",`${h.id}:${k}`);
  const affectsActive=(S.case.selected===id||S.case.readinessRequest===id)&&!["ARRIVED","HANDOFF_COMPLETE","CASE_CLOSED"].includes(S.case.status);
  const transportActive=S.case.status==="EN_ROUTE";
  if(affectsActive&&["beds","cap","accept"].includes(k)){
    const unavailable=!h.accept||h.beds<=0;
    if(transportActive&&unavailable){
      S.case.routeAlert={hospitalId:id,reason:!h.accept?"not_accepting":"no_beds",time:now(),acknowledged:false};
      if(S.scenario?.id==="readiness_changes_enroute"){S.scenarioProgress.routeAlertCreated=true;S.scenarioProgress.noSilentReroute=true}
      log("VITALINK","Receiving readiness changed during transport — manual review required","تغيرت جاهزية الاستقبال أثناء النقل — يلزم مراجعة يدوية",`${id} • ${S.case.routeAlert.reason}`);
    }else if(unavailable){
      S.case.hospitalConfirmed=false;S.case.readinessRequest=null;S.case.routeAlert=null;S.case.prearrival={team:false,bay:false,monitor:false};
      const nb=bestHospital();S.case.selected=nb?.id||null;transitionWorkflow("HOSPITAL_MATCHED","readiness-change");
      if(oldSelected!==S.case.selected){
        S.case.lastRecommendation=S.case.selected;S.case.override=null;
        S.case.recommendationChange={from:oldSelected,to:S.case.selected,reason:"readiness_changed",time:now()};
        log("VITALINK","Destination recalculated after readiness change","تمت إعادة حساب الوجهة بعد تغير الجاهزية",`${oldSelected} → ${S.case.selected||"manual escalation"}`)
      }
    }else if(S.case.hospitalConfirmed&&!transportActive){
      S.case.hospitalConfirmed=false;transitionWorkflow("HOSPITAL_MATCHED","confirmation-invalidated");S.case.readinessRequest=null;S.case.routeAlert=null;
      S.case.recommendationChange={from:id,to:id,reason:"confirmation_invalidated",time:now()};
      log("VITALINK","Previous hospital confirmation invalidated after readiness change","تم إلغاء تأكيد المستشفى السابق بعد تغير الجاهزية")
    }
  }
  saveRender()
}

function refreshHospitalData(){
  S.hospitals.forEach(h=>h.lastUpdated=Date.now());
  if(S.scenario?.id==="stale_readiness")S.scenarioProgress.feedRefreshed=true;
  const active=activeDestination();
  if(S.case.routeAlert&&active&&active.accept&&active.beds>0){
    S.case.routeAlert=null;
    log("VITALINK","Receiving readiness alert cleared after refreshed viable status","تم إلغاء تنبيه جاهزية الاستقبال بعد تحديث حالة قابلة للاستقبال")
  }
  log("VITALINK","Hospital readiness feed refreshed","تم تحديث بيانات جاهزية المستشفيات");
  saveRender();
  showToast("Hospital data refreshed","تم تحديث بيانات المستشفيات","The MVP readiness timestamps were refreshed.","تم تحديث أوقات بيانات الجاهزية التجريبية.")
}


function reviewRouteAlternatives(){
  if(!guardStatus(["EN_ROUTE"])||!S.case.routeAlert)return;
  const old=S.case.selected;
  S.case.routeAlert=null;S.case.readinessRequest=null;S.case.hospitalConfirmed=false;
  const nb=bestHospital();S.case.selected=nb?.id||null;S.case.lastRecommendation=S.case.selected;
  if(!transitionWorkflow("HOSPITAL_MATCHED","manual-route-review"))return;
  S.case.recommendationChange={from:old,to:S.case.selected,reason:"transport_readiness_review",time:now()};
  if(S.scenario?.id==="readiness_changes_enroute")S.scenarioProgress.routeReviewed=true;
  log("Paramedic","Manual destination review triggered during transport","تم بدء مراجعة يدوية للوجهة أثناء النقل",`${old} → ${S.case.selected||"manual escalation"}`);
  saveRender()
}
function acknowledgeRouteAlert(){
  if(!S.case.routeAlert||S.case.routeAlert.acknowledged)return;
  S.case.routeAlert.acknowledged=true;S.case.routeAlert.acknowledgedAt=now();
  log("Paramedic","Receiving-readiness alert acknowledged","تم تأكيد الاطلاع على تنبيه جاهزية الاستقبال",S.case.routeAlert.reason);
  saveRender();
  showToast("Alert acknowledged","تم تأكيد الاطلاع","The current transport state is preserved. Manual coordination is still required.","تم الحفاظ على حالة النقل الحالية. ما زال التنسيق اليدوي مطلوبًا.")
}
function routeRiskPanel(){
  if(!S.case.routeAlert)return "";
  const h=S.hospitals.find(x=>x.id===S.case.routeAlert.hospitalId);
  return `<div class="routeRisk"><h4>${T("Receiving readiness changed during transport","تغيرت جاهزية الاستقبال أثناء النقل")}</h4><p>${T("VITALINK did not automatically redirect the ambulance. Human review is required before changing destination.","لم يقم VITALINK بتحويل سيارة الإسعاف تلقائيًا. يلزم قرار بشري قبل تغيير الوجهة.")}<br><b>${T("Hospital","المستشفى")}:</b> ${h?hospitalName(h.id):S.case.routeAlert.hospitalId} • <b>${T("Reason","السبب")}:</b> ${S.case.routeAlert.reason==="no_beds"?T("No beds","لا توجد أسرة"):T("Not accepting","لا يستقبل حالات")}</p><div class="resilienceActions"><button class="btn danger" onclick="V.reviewRouteAlternatives()">${T("Review Alternative Destinations","مراجعة وجهات بديلة")}</button><button class="btn outline" onclick="V.go('hospital')">${T("Open Hospital Command","فتح واجهة المستشفى")}</button><button class="btn ghost" ${S.case.routeAlert.acknowledged?"disabled":""} onclick="V.acknowledgeRouteAlert()">${S.case.routeAlert.acknowledged?T("Acknowledged ✓","تم الاطلاع ✓"):T("Acknowledge Alert","تأكيد الاطلاع")}</button></div></div>`
}

function startNavigation(id){
  if(!guardStatus(["HOSPITAL_READY"]))return;
  if(!S.case.hospitalConfirmed||S.case.selected!==id)return;
  if(!transitionWorkflow("EN_ROUTE","transport-start"))return;
  S.case.milestones.enroute=now();
  log("Paramedic","Transport navigation started","بدأ توجيه نقل المريض",hospitalName(id));
  saveRender()
}
function markArrived(){
  if(!guardStatus(["EN_ROUTE"]))return;
  if(!transitionWorkflow("ARRIVED","arrival"))return;
  S.case.milestones.arrived=now();
  log("Paramedic","Ambulance arrived at receiving hospital","وصلت سيارة الإسعاف إلى المستشفى المستقبل",hospitalName(S.case.selected));
  saveRender();showToast("Arrival recorded","تم تسجيل الوصول","The hospital can now confirm the patient handoff.","يمكن للمستشفى الآن تأكيد استلام المريض.")
}
function setHandoffNote(v){S.case.handoffNote=clean(v);save();publishState("handoff-note")}
function confirmHandoff(){
  if(!guardStatus(["ARRIVED"]))return;
  if(!transitionWorkflow("HANDOFF_COMPLETE","handoff"))return;
  S.case.milestones.handoff=now();
  log("Hospital","Patient handoff completed","اكتمل تسليم المريض",S.case.handoffNote||T("No additional receiving note","لا توجد ملاحظة استقبال إضافية"));
  saveRender();showToast("Handoff completed","اكتمل التسليم","The patient has been received by the hospital team.","تم استلام المريض من فريق المستشفى.")
}
function closeCase(){
  if(!guardStatus(["HANDOFF_COMPLETE"]))return;
  if(!transitionWorkflow("CASE_CLOSED","case-close"))return;
  S.case.milestones.closed=now();
  log("Hospital","Emergency case closed","تم إغلاق حالة الطوارئ",hospitalName(S.case.selected));
  saveRender();showToast("Case closed","تم إغلاق الحالة","The emergency workflow is complete and remains available in the audit trail.","اكتمل مسار الطوارئ ويبقى السجل متاحًا في سجل الحالة.")
}

  const h=S.hospitals.find(x=>x.id===id);

}
function overrideReasonLabel(key){
  const m={
    clinical:T("Paramedic clinical judgment","الحكم السريري للمسعف"),
    patient:T("Patient preference / known care relationship","تفضيل المريض / علاقة علاجية معروفة"),
    access:T("Access or transport consideration","اعتبارات الوصول أو النقل"),
    operations:T("Operational coordination","تنسيق تشغيلي"),
    other:T("Other documented reason","سبب موثق آخر")
  };
  return m[key]||key||"—"
}
function beginOverride(id){
  const target=S.hospitals.find(h=>h.id===id),auto=S.case.lastRecommendation||bestHospital()?.id;
  if(!target)return;
  if(readinessFreshness(target).key==="stale"){showToast("Refresh required","التحديث مطلوب","Refresh this hospital's readiness data before selecting it as a destination.","حدّث بيانات جاهزية هذا المستشفى قبل اختياره كوجهة.");return}
  if(!target.accept||target.beds<=0){showToast("Hospital unavailable","المستشفى غير متاح","This hospital is not currently available for receiving. Choose an available alternative.","هذا المستشفى غير متاح للاستقبال حاليًا. اختر بديلًا متاحًا.");return}
  if(!id||id===auto){selectHospital(id);return}
  overrideUI={target:id,reason:"",note:""};
  render()
}
function setOverrideReason(v){
  if(!overrideUI)return;
  overrideUI.reason=v;render()
}
function setOverrideNote(v){
  if(!overrideUI)return;
  overrideUI.note=clean(v)
}
function cancelOverride(){overrideUI=null;render()}
function confirmOverride(){
  if(!guardStatus(["HOSPITAL_MATCHED"]))return;
  if(!overrideUI||!overrideUI.reason){
    showToast("Override reason required","سبب التجاوز مطلوب","Select a reason before confirming the manual destination.","اختر سببًا قبل تأكيد الوجهة اليدوية.");return
  }
  if(overrideUI.reason==="other"&&!overrideUI.note.trim()){
    showToast("Add a short note","أضف ملاحظة قصيرة","Document the reason for this override.","وثّق سبب هذا التجاوز.");return
  }
  const from=S.case.lastRecommendation||S.case.selected;
  const to=overrideUI.target;
  const detail=`${from||"—"} → ${to} • ${overrideReasonLabel(overrideUI.reason)}${overrideUI.note?` • ${overrideUI.note}`:""}`;
  S.case.override={from,to,reason:overrideUI.reason,note:overrideUI.note,time:now(),by:"Paramedic"};
  S.case.selected=to;
  S.case.readinessRequest=null;
  S.case.hospitalConfirmed=false;
  transitionWorkflow("HOSPITAL_MATCHED","human-override");
  S.case.recommendationChange=null;S.case.milestones={enroute:null,arrived:null,handoff:null,closed:null};S.case.handoffBriefAt=null;S.case.handoffNote="";
  log("Paramedic","Human override of hospital recommendation","تجاوز بشري لتوصية المستشفى",detail);
  overrideUI=null;
  saveRender();
  showToast("Human override recorded","تم تسجيل التجاوز البشري","The alternate hospital is selected and the reason is stored in the case audit.","تم اختيار المستشفى البديل وحفظ السبب في سجل الحالة.")
}

function timeline(){return S.case.timeline.length?`<div class="timeline">${[...S.case.timeline].reverse().map(x=>`<div class="titem"><b>${S.lang==="ar"?x.ar:x.en}</b><small>${x.time} • ${x.actor}${x.detail?` • ${x.detail}`:""}</small></div>`).join("")}</div>`:`<div class="small">${T("No events yet.","لا توجد أحداث بعد.")}</div>`}
function freshAgo(ts){
  const s=Math.max(1,Math.round((Date.now()-ts)/1000));
  if(s<60)return T(`Updated ${s}s ago`,`تم التحديث قبل ${s} ثانية`);
  const m=Math.floor(s/60);if(m<60)return T(`Updated ${m} min ago`,`تم التحديث قبل ${m} دقيقة`);
  const h=Math.floor(m/60);return T(`Updated ${h} h ago`,`تم التحديث قبل ${h} ساعة`)
}

    ["trauma",T("Trauma / Injury","إصابة / حادث"),T("Fall, crash or physical injury","سقوط أو حادث أو إصابة")],

      <p>${T("Share the patient name, location and emergency condition. If typing is difficult, use voice input or send a quick emergency request with the information already available.","شارك اسم المريض وموقعه والحالة الطارئة. إذا كانت الكتابة صعبة استخدم الإدخال الصوتي أو أرسل طلب طوارئ سريع بالبيانات المتوفرة.")}</p>

    <div class="patientSideCard">

        <div class="locationStatus"><div><div class="label">${T("CURRENT LOCATION","الموقع الحالي")}</div><b>${S.case.location||T("Location not set","لم يتم تحديد الموقع")}</b></div><span class="${locationReady?"":"orangeText"}">${locationReady?T("Available","متوفر"):T("Needs location","يحتاج موقعًا")}</span></div>

      </div>

}
function dispatchScreen(){
  if(!S.case.created){
    return `<div class="pageHead"><div><h2>${T("911 Dispatch Center — MVP Simulation","مركز الطوارئ 911 — محاكاة MVP")}</h2><p>${T("The dispatch center activates only after an emergency request is submitted.","يتم تفعيل مركز التوجيه بعد إرسال طلب طوارئ.")}</p></div>${badge(T("WAITING FOR CASE","بانتظار بلاغ"),"bGray")}</div>
    <div class="emptyState"><div class="emptyStateInner"><div class="emptyStateIcon">911</div><h3>${T("No incoming emergency request yet","لا يوجد بلاغ طوارئ وارد بعد")}</h3><p>${T("Submit a patient emergency request first, or load the prepared demo scenario to test the complete workflow.","أرسل طلب طوارئ من واجهة المريض أولًا، أو حمّل سيناريو العرض الجاهز لاختبار المسار كاملًا.")}</p><div class="emptyActions"><button class="btn primary" onclick="V.go('patient')">${T("Open Patient Interface","فتح واجهة المريض")}</button><button class="btn teal" onclick="V.openScenarioLab(true)">${T("Open Scenario Lab","فتح مختبر السيناريوهات")}</button></div></div></div>`;
  }
  const dispatched=order.indexOf(S.case.status)>=order.indexOf("DISPATCHED");
  const acknowledged=order.indexOf(S.case.status)>=order.indexOf("EMS_ASSIGNED");
  const units=dispatchUnits(),recommended=recommendedUnit();
  const priority=["uncon","bleed"].includes(S.case.emergency)?T("CRITICAL","حرجة"):["chest","breath"].includes(S.case.emergency)?T("HIGH PRIORITY","أولوية عالية"):T("URGENT","عاجلة");
  return `<div class="pageHead"><div><h2>${T("911 Dispatch Center — MVP Simulation","مركز الطوارئ 911 — محاكاة MVP")}</h2><p>${T("Turn the incoming patient request into a clear response decision: verify the incident, choose an available unit, dispatch it and confirm that EMS received the case.","حوّل طلب المريض إلى قرار استجابة واضح: راجع البلاغ، اختر وحدة متاحة، أرسلها، ثم أكد أن طاقم الإسعاف استلم الحالة.")}</p></div>${badge(T("SIMULATED 911","911 محاكاة"),"bOrange")}</div>
  ${workflow()}

  <div class="dispatchCommandGrid">
    <div>
      <div class="dispatchIncident">
        <div class="incidentTop"><span class="incidentId">${T("CASE","الحالة")} ${S.case.id}</span><span class="incidentPriority">● ${priority}</span></div>
        <div class="incidentTitle">${emergencyLabel(S.case.emergency)}</div>
        <div class="incidentSubtitle">${S.case.notes||T("No additional description was provided. Dispatch is based on the available emergency request data.","لم يتم تقديم وصف إضافي. يتم التوجيه بناءً على بيانات البلاغ المتوفرة.")}</div>
        <div class="dispatchLocationStrip">
          <div class="dispatchLocationMetric"><span>${T("PATIENT","المريض")}</span><b>${S.case.name||T("Unknown","غير معروف")}</b></div>
          <div class="dispatchLocationMetric"><span>${T("CURRENT LOCATION","الموقع الحالي")}</span><b>${S.case.location}</b></div>
        </div>
      </div>

      <div class="dispatchConsole" style="margin-top:15px">
        <div class="dispatchConsoleHead"><div><h3>${T("Response Unit Selection","اختيار وحدة الاستجابة")}</h3><p>${T("Availability and ETA are simulated for the MVP.","التوفر وزمن الوصول محاكاة لأغراض الـMVP.")}</p></div><span class="dispatchLive">${T("LIVE QUEUE","قائمة حية")}</span></div>

        <div class="dispatchUnitList">
          ${units.map(u=>`<div class="dispatchUnit ${u.busy?"busy":recommended&&u.id===recommended.id?"selected":""}">
            <div class="unitGlyph">✚</div>
            <div class="dispatchUnitInfo"><b>${S.lang==="ar"?u.ar:u.en}</b><span>${S.lang==="ar"?u.areaAr:u.areaEn} • ${u.busy?T("Currently unavailable","غير متاحة حاليًا"):recommended&&u.id===recommended.id?T("Recommended available response unit","وحدة الاستجابة المتاحة الموصى بها"):T("Alternative response unit","وحدة استجابة بديلة")}</span></div>
            <div class="dispatchUnitMeta"><strong>${u.eta?String(u.eta).padStart(2,"0")+" min":"—"}</strong><small class="${u.busy?"unitBusy":"unitAvailable"}">${u.busy?T("Busy","مشغولة"):T("Available • Crew ready","متاحة • الطاقم جاهز")}</small></div>
          </div>`).join("")}
        </div>

        <div class="dispatchDecision">
          <div class="dispatchDecisionTop"><b>${T("Recommended Response","الاستجابة الموصى بها")}</b><span>${T("Based on unit availability + ETA","بناءً على التوفر + زمن الوصول")}</span></div>
          <div class="kv"><span>${T("Selected Unit","الوحدة المختارة")}</span><span>${recommended?recommended.id:"—"}</span></div>
          <div class="kv"><span>${T("Estimated Arrival","زمن الوصول المتوقع")}</span><span>${recommended&&recommended.eta?`${String(recommended.eta).padStart(2,"0")} ${T("min","دقائق")}`:T("Unavailable until location is resolved","غير متاح حتى تحديد الموقع")}</span></div>
          <div class="kv"><span>${T("Crew Status","حالة الطاقم")}</span><span class="ok">${T("Complete • Ready","مكتمل • جاهز")}</span></div>
          <div class="dispatchButtonRow">
            <button class="dispatchPrimary ${dispatched?"sent":""}" ${dispatched||!recommended?"disabled":""} onclick="V.assignAmbulance()">${dispatched?T("Dispatch Sent ✓","تم إرسال البلاغ ✓"):recommended?`${T("Dispatch","إرسال")} ${recommended.id}`:T("No Unit Available","لا توجد وحدة متاحة")}</button>
            ${acknowledged?`<button class="btn successBtn" onclick="V.go('ems')">${T("Open Active EMS Case","فتح الحالة لدى المسعف")}</button>`:""}
          </div>
        </div>

        ${dispatched?`<div class="ackPanel"><div class="ackPanelTop"><b>${T("Ambulance Handoff","تسليم البلاغ للإسعاف")}</b>${acknowledged?`<span class="ackReady">${T("ACKNOWLEDGED","تم الاستلام")}</span>`:`<span class="ackWaiting">${T("WAITING ACKNOWLEDGEMENT","بانتظار تأكيد الاستلام")}</span>`}</div><p>${acknowledged?T(`${S.case.ambulance} confirmed receipt. The same live case is now available on the paramedic interface.`,`أكدت ${S.case.ambulance} استلام البلاغ. أصبحت نفس الحالة الحية متاحة الآن على واجهة المسعف.`):T("The dispatch was sent successfully. For the MVP demo, confirm the ambulance acknowledgement to continue the workflow.","تم إرسال البلاغ بنجاح. لأغراض عرض الـMVP، أكد استلام سيارة الإسعاف لمتابعة المسار.")}</p>${!acknowledged?`<button class="btn teal" style="margin-top:10px" onclick="V.acknowledgeAmbulance()">${`${T("Simulate Acknowledgement","محاكاة تأكيد الاستلام")} • ${S.case.ambulance}`}</button>`:""}</div>`:""}

        <div class="dispatchProtocol"><b>◈ ${T("Dispatch Safety Rule","قاعدة التوجيه")}</b>${T("The case is not considered active on the EMS side until the ambulance crew acknowledges receipt. This prevents a silent handoff in the demo workflow.","لا تعتبر الحالة نشطة لدى الإسعاف حتى يؤكد الطاقم استلام البلاغ، مما يمنع انتقالًا صامتًا للحالة ضمن مسار العرض.")}</div>
      </div>
    </div>

    <div class="dispatchRightStack">
      <div class="dispatchCaseCard">
        <div class="dispatchConsoleHead"><div><h3>${T("Incoming Emergency Report","بلاغ الطوارئ الوارد")}</h3><p>${T("Information received from the patient request","المعلومات الواردة من طلب المريض")}</p></div>${badge(priority,["uncon","bleed"].includes(S.case.emergency)?"bRed":"bOrange")}</div>
        <div class="kv"><span>${T("Case ID","رقم البلاغ")}</span><span>${S.case.id}</span></div>
        <div class="kv"><span>${T("Patient","المريض")}</span><span>${S.case.name||T("Unknown","غير معروف")}</span></div>
        <div class="kv"><span>${T("Request For","الطلب من أجل")}</span><span>${S.case.requestFor==="self"?T("Patient self-request","المريض طلب لنفسه"):T("Requested by another person","تم الطلب بواسطة شخص آخر")}</span></div>
        <div class="kv"><span>${T("Emergency","الحالة")}</span><span>${emergencyLabel(S.case.emergency)}</span></div>
        <div class="kv"><span>${T("Location","الموقع")}</span><span>${S.case.location}</span></div>
        <div class="kv"><span>${T("Description","الوصف")}</span><span>${S.case.notes||T("Not provided","غير متوفر")}</span></div>
        <div class="dispatchDataQuality">
          <span class="dataChip ${hasResolvedPatientLocation()?"ok":"warn"}">${hasResolvedPatientLocation()?T("Location available","الموقع متوفر"):T("Location unresolved","الموقع غير محدد")}</span>
          <span class="dataChip ${S.case.name? "ok":"warn"}">${S.case.name?T("Patient identified","هوية المريض متوفرة"):T("Unknown patient","مريض غير معروف")}</span>
          <span class="dataChip ok">${T("Emergency category set","تم تحديد نوع الحالة")}</span>
        </div>
      </div>

      <div class="card"><h3>${T("Case Timeline","الخط الزمني للحالة")}</h3>${timeline()}</div>
      <div class="dispatchProtocol"><b>${T("MVP Integration Note","ملاحظة تكامل الـMVP")}</b>${T("The 911 center shown here is a functional simulation. A real deployment would require formal integration with the responsible emergency authority and its dispatch systems.","مركز 911 المعروض هنا محاكاة وظيفية. التطبيق الفعلي يتطلب تكاملًا رسميًا مع الجهة المسؤولة وأنظمة التوجيه التابعة لها.")}</div>
    </div>
  </div>`;
}
function reasonsFor(h){
  let arr=[];
  if(h.fit)arr.push(T("Required clinical capability is available.","القدرة الطبية المطلوبة متوفرة."));
  if(h.beds>0)arr.push(T(`${h.beds} emergency bed(s) currently available.`,`يتوفر حاليًا ${h.beds} سرير/أسرة للطوارئ.`));
  if(h.accept)arr.push(T("Hospital is accepting new emergency cases.","المستشفى يستقبل حالات طارئة جديدة."));
  arr.push(T(`Current caseload signal: ${h.cases} active case(s) on the configured MVP scale.`,`إشارة عبء الحالات الحالي: ${h.cases} حالة نشطة وفق مقياس الـMVP المحدد.`));
  if(h.icu&&h.needs?.highAcuity)arr.push(T("ICU capability contributes to higher-acuity support.","قدرة العناية الحثيثة تساهم في دعم الحالات الأعلى حدة."));
  if(hasResolvedPatientLocation())arr.push(T(`Demo travel estimate is ${h.eta} minutes.`,`تقدير الوصول التجريبي ${h.eta} دقائق.`));
  else arr.push(T("Travel is not scored until the patient location is resolved.","لا يتم احتساب الوصول حتى يتم تحديد موقع المريض."));
  return arr;
}

function readinessState(){

function compareHospital(h,isSelected,isSystemRec,i){
  const m=hospitalScore(h),fresh=readinessFreshness(h),confidence=hospitalDataConfidence(h);
  let reason="";
  if(!m.fit)reason=T("Required capability is missing.","القدرة المطلوبة غير متوفرة.");
  else if(!h.accept)reason=T("Not accepting new emergency cases.","لا يستقبل حالات طارئة جديدة.");
  else if(h.beds<=0)reason=T("No available beds.","لا توجد أسرة متاحة.");
  else if(m.needs.highAcuity&&!h.icu)reason=T("Ranks lower because high-acuity support is limited in this demo.","ترتيبه أقل لأن دعم الحالات الأعلى حدة محدود في هذا العرض.");
  else reason=T("Meets the current MVP requirements.","يحقق متطلبات الـMVP الحالية.");
  return `<div class="compareCard ${isSystemRec?"systemRec":""} ${isSelected&&!isSystemRec?"currentOverride":""}">
    <div class="compareRank">${T("RANK","الترتيب")} ${i+1}${isSystemRec?` • ${T("SYSTEM RECOMMENDATION","توصية النظام")}`:""}${isSelected?` • ${T("CURRENT DESTINATION","الوجهة الحالية")}`:""}</div>
    <div class="compareName">${S.lang==="ar"?h.ar:h.en}<span class="demoDataTag">${T("DEMO DATA","بيانات تجريبية")}</span></div>
    <div class="compareScore">${m.score}<span class="small">/100</span></div>
    <div class="compareStatus"><span class="statusMini ${fresh.key==="fresh"?"ok":fresh.key==="aging"?"warn":"bad"}">${T("Data","البيانات")}: ${fresh.label}</span><span class="statusMini ${confidence.key==="high"?"ok":confidence.key==="medium"?"warn":"bad"}">${T("Confidence","الثقة")}: ${confidence.label}</span>
      <span class="statusMini ${m.fit?"ok":"bad"}">${m.fit?T("Suitable","ملائم"):T("Not suitable","غير ملائم")}</span>
      <span class="statusMini ${h.accept?"ok":"bad"}">${h.accept?T("Accepting","يستقبل"):T("Closed","غير مستقبِل")}</span>
      <span class="statusMini ${h.beds>0?"ok":"bad"}">${h.beds} ${T("beds","أسرة")}</span>
    </div>
    <div class="kv"><span>${T("Demo ETA","وقت الوصول التجريبي")}</span><span>${h.eta} min</span></div>
    <div class="kv"><span>${T("ED Capacity","سعة الطوارئ")}</span><span>${h.cap}%</span></div>
    <div class="compareReason">${reason}</div>
    ${isSelected?`<button class="btn ${isSystemRec?"primary":"ghost"}" style="margin-top:9px" disabled>${isSystemRec?T("Current System Recommendation","توصية النظام الحالية"):T("Current Human-Selected Destination","الوجهة الحالية المختارة بشريًا")}</button>`:isSystemRec?`<button class="btn teal" style="margin-top:9px" onclick="V.beginOverride('${h.id}')">${T("Use System Recommendation","استخدام توصية النظام")}</button>`:`<button class="btn ghost" style="margin-top:9px" onclick="V.beginOverride('${h.id}')">${T("Override to This Hospital","تجاوز واختيار هذا المستشفى")}</button>`}
  </div>`
}

            <option value="pain" ${S.case.vitals.con==="pain"?"selected":""}>${T("Responds to Pain","يستجيب للألم")}</option>
            <option value="unresponsive" ${S.case.vitals.con==="unresponsive"?"selected":""}>${T("Unresponsive","غير مستجيب")}</option>
          </select>
          <span class="vitalHint">${T("Field observation","ملاحظة ميدانية")}</span>
        </div>
      </div>

      ${errors.length?`<div class="validationList">${errors.map(e=>`<div class="validationItem">⚠ ${e}</div>`).join("")}</div>`:""}

      <div class="assessmentActions">
        <div class="assessmentNote">${T("MVP note: alert bands are transparent demo heuristics for workflow testing, not a validated clinical protocol.","ملاحظة MVP: مؤشرات التنبيه قواعد تجريبية شفافة لاختبار سير العمل وليست بروتوكولًا سريريًا معتمدًا.")}</div>
        <button class="btn teal" ${canRecalculate?"":"disabled"} onclick="V.runAnalysis()">${!canRecalculate?T("Match Locked at Current Stage","المطابقة مقفلة في المرحلة الحالية"):hasAnalysis?T("Recalculate Hospital Match","إعادة حساب مطابقة المستشفى"):T("Find Appropriate Hospital","البحث عن المستشفى المناسب")}</button>
      </div>
    </div>

      <div class="card"><h3>${T("Hospital Decision Support","دعم قرار المستشفى")}</h3>
        <div class="notice info">${T("Complete the field assessment, then VITALINK will compare patient needs with hospital capability, available beds, ED capacity, acceptance status and travel time.","أكمل التقييم الميداني، ثم سيقارن VITALINK احتياجات المريض مع قدرة المستشفى والأسرة وسعة الطوارئ وحالة الاستقبال ووقت الوصول.")}</div>
        <div class="divider"></div>
        <div class="kv"><span>${T("Primary Specialty Need","الاحتياج التخصصي")}</span><span>${needs.specialty}</span></div>
        <div class="kv"><span>${T("Higher-Acuity Support","دعم حدة أعلى")}</span><span>${needs.highAcuity?T("May influence ranking","قد يؤثر على الترتيب"):T("Not currently triggered","غير مفعّل حاليًا")}</span></div>
        <div class="kv"><span>${T("Readiness Feed","بيانات الجاهزية")}</span><span>${freshAgo(lastRefresh)}</span></div>
      </div>`:
      decisionPanel(sel,r,needs)
    }
  </div>

  ${hasAnalysis?`
    <h3 style="margin:22px 0 8px">${T("Hospital Comparison","مقارنة المستشفيات")}</h3>
    <div class="small" style="margin-bottom:11px">${T("The system keeps alternatives visible so the paramedic can understand why one hospital ranks above another.","يبقي النظام البدائل ظاهرة حتى يفهم المسعف لماذا يتقدم مستشفى على آخر.")}</div>
    <div class="hospitalCompare">${r.map((h,i)=>compareHospital(h,!!sel&&h.id===sel.id,h.id===(S.case.lastRecommendation||bestHospital()?.id),i)).join("")}</div>
    ${sel?mapPanel(sel):""}
    ${sel&&S.case.hospitalConfirmed?handoffBriefPanel(sel,"ems"):""}
    ${S.case.hospitalConfirmed?lifecyclePanel():""}
  `:""}`;
}
function hospitalCard(h,rec,i){
  const m=hospitalScore(h),fail=!m.fit?T("Required specialty/capability is not available.","التخصص أو القدرة المطلوبة غير متوفرة."):!h.accept?T("Hospital is not accepting new emergency cases.","المستشفى لا يستقبل حالات طارئة جديدة."):h.beds<=0?T("No available beds.","لا توجد أسرة متاحة."):"";
  return `<div class="card hcard ${rec?"recommended":""}">${rec?`<div class="tag">${T("RECOMMENDED","موصى به")}</div>`:""}<h3>${i+1}. ${S.lang==="ar"?h.ar:h.en}</h3><div class="score">${m.score}<span class="small"> /100</span></div><div class="cap"><span>${T("Distance","المسافة")}</span><b>${h.distance} km</b></div><div class="cap"><span>${T("ETA","وقت الوصول")}</span><b>${h.eta} min</b></div><div class="cap"><span>${T("Available Beds","الأسرة المتاحة")}</span><b>${h.beds}/${h.total}</b></div><div class="cap"><span>${T("ED Capacity","سعة الطوارئ")}</span><b>${h.cap}%</b></div><div class="cap"><span>${T("Accepting","يستقبل حالات")}</span><b class="${h.accept?"ok":"bad"}">${h.accept?T("YES","نعم"):T("NO","لا")}</b></div><div class="cap"><span>${T("Suitable","ملائم")}</span><b class="${m.fit?"ok":"bad"}">${m.fit?T("YES","نعم"):T("NO","لا")}</b></div>${fail?`<div class="failReason">${fail}</div>`:""}<button class="btn ${rec?"primary":"ghost"}" style="margin-top:10px" onclick="V.selectHospital('${h.id}')">${rec?T("Current Recommendation","التوصية الحالية"):T("Choose Alternative","اختيار البديل")}</button></div>`;
}

  return `<div class="mapPanel" id="route" style="margin-top:17px">

      <a class="btn outline" target="_blank" rel="noopener" href="${directionsUrl(h)}">${T("Open Map","فتح الخريطة")} ↗</a>
    </div>
    <div class="mapFrameWrap">
      <iframe class="mapFrame" title="${T("Receiving hospital map context","سياق خريطة المستشفى المستقبل")}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" onload="V.mapFrameLoaded()" src="${mapEmbedUrl(h)}"></iframe><div id="mapRecovery" class="mapRecovery"><b>${T("Loading map context…","جارٍ تحميل سياق الخريطة…")}</b>${T("If the embedded map does not load, use Open Map or the Google Maps link below.","إذا لم يتم تحميل الخريطة المضمنة فاستخدم فتح الخريطة أو رابط Google Maps أدناه.")}</div>
      <div class="mapOverlay">
        <div class="label">${T("SELECTED DESTINATION","الوجهة المختارة")}</div>
        <h3 style="margin:5px 0">${S.lang==="ar"?h.ar:h.en}</h3>
        <div class="kv"><span>${T("Distance","المسافة")}</span><span>${travelDistanceText(h)}</span></div>
        <div class="kv"><span>${T("Demo ETA","وقت الوصول التجريبي")}</span><span>${h.eta} min</span></div>
        <div class="kv"><span>${T("Available Beds","الأسرة المتاحة")}</span><span>${h.beds}</span></div>
        <div class="kv"><span>${T("Readiness","الجاهزية")}</span><span class="${S.case.routeAlert?"orangeText":confirmed?"ok":"orangeText"}">${S.case.routeAlert?T("Changed — review required","تغيرت — المراجعة مطلوبة"):confirmed?T("Confirmed","مؤكدة"):T("Not confirmed","غير مؤكدة")}</span></div>
      </div>
    </div>
    <div class="routeSummary">
      <div class="routeHospitalHead"><div><div class="label" style="color:#8EA8B6">${T("RECEIVING HOSPITAL","المستشفى المستقبل")}</div><h3>${S.lang==="ar"?h.ar:h.en}</h3></div><div class="routeIcon">⌘</div></div>
      <div class="routeMetrics"><div class="routeMetric"><span>${T("Distance","المسافة")}</span><strong>${hasResolvedPatientLocation()?`${h.distance} <small>km</small>`:T("Unresolved","غير محدد")}</strong></div><div class="routeMetric"><span>${T("Demo ETA","وقت وصول تجريبي")}</span><strong>${hasResolvedPatientLocation()?`${String(h.eta).padStart(2,"0")} <small>${T("min","دقائق")}</small>`:T("Unavailable","غير متاح")}</strong></div></div>
      <div class="routeLine"><span>● ${T("Irbid / Ramtha corridor","مسار إربد / الرمثا")}</span><span class="traffic">${T("Demo ETA • open Google Maps for live route context","وقت وصول تجريبي • افتح Google Maps لسياق الطريق الحي")}</span></div>
      <div class="routeDisclaimer">${T("The distance and ETA shown in this prototype are demo values. Google Maps is used for geographic context and the external route link; live traffic is not ingested into VITALINK.","المسافة ووقت الوصول المعروضان في هذا النموذج قيم تجريبية. تُستخدم Google Maps للسياق الجغرافي ورابط المسار الخارجي، ولا يتم إدخال حركة المرور الحية إلى VITALINK.")}</div>
      ${S.case.status==="HOSPITAL_READY"
        ? `<button class="mapCta" onclick="V.startNavigation('${h.id}')">${T("Start Transport Navigation","بدء توجيه النقل")}</button>`
        : S.case.status==="EN_ROUTE"
        ? `<button class="mapCta" onclick="V.markArrived()">${T("Mark Arrived at Hospital","تسجيل الوصول إلى المستشفى")}</button>`
        : S.case.status==="ARRIVED"
        ? `<button class="mapCta" disabled>${T("Arrived — Waiting Hospital Handoff","تم الوصول — بانتظار تسليم المستشفى")}</button>`
        : ["HANDOFF_COMPLETE","CASE_CLOSED"].includes(S.case.status)
        ? `<button class="mapCta" disabled>${S.case.status==="CASE_CLOSED"?T("Case Closed","الحالة مغلقة"):T("Handoff Completed","اكتمل التسليم")}</button>`
        : `<button class="mapCta" disabled>${T("Waiting for Hospital Confirmation","بانتظار تأكيد المستشفى")}</button>`
